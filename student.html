*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Hind Siliguri",sans-serif}button,input,select,textarea{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}.app{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr)}.sidebar{background:linear-gradient(180deg,#071f49,#0a2e69 62%,#061d43);color:#fff;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 24px}.brand img{width:46px;height:46px;object-fit:contain;background:white;border-radius:14px;padding:3px}.brand strong{display:block;font-size:17px;letter-spacing:.3px}.brand small{display:block;color:#c7d8f5;font-size:11px}.nav-label{font-size:10px;letter-spacing:1.2px;color:#8eaddb;padding:12px 12px 6px;font-weight:800}.nav{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;margin:2px 0;border:0;border-radius:12px;color:#d7e5ff;background:transparent;text-align:left;font-weight:600}.nav:hover,.nav.active{background:linear-gradient(100deg,#1468e8,#2c7ff2);color:#fff}.nav .ico{width:18px;text-align:center;font-size:16px}.nav.sub{padding-left:40px;font-size:12px;color:#bcd0f1}.side-bottom{margin-top:auto;padding:14px 10px 4px;color:#b8ccec;font-size:12px}.side-bottom b{color:#fff}.main{min-width:0;padding:20px 24px 36px}.topbar{display:flex;align-items:center;gap:15px;margin-bottom:18px}.search{height:48px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:0 15px;flex:1;max-width:760px}.search input{border:0;outline:0;flex:1;min-width:0;color:var(--ink)}.top-actions{margin-left:auto;display:flex;align-items:center;gap:14px}.profile-mini{display:flex;align-items:center;gap:9px;font-weight:700}.avatar{width:38px;height:38px;border-radius:50%;background:#dbeafe;display:grid;place-items:center;overflow:hidden;color:var(--blu rder-color:#6ea3ff;box-shadow:0 0 0 3px #dbeafe}.filters .field{flex:1;min-width:170px}.qcard{padding:15px;border:1px solid var(--line);border-radius:15px;margin-bottom:10px;background:#fff}.qcard h3{margin:6px 0;font-size:14px}.qmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--muted)}.qactions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}.empty{padding:38px 18px;text-align:center;color:var(--muted);border:1px dashed #cbd8ec;border-radius:15px;background:#fbfdff}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.progress{height:9px;border-radius:99px;background:#e8eef8;overflow:hidden}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#1765e8,#21b5a1)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.formgrid label{display:grid;gap:5px;color:#50617c;font-size:11px;font-weight:700}.formgrid .wide{grid-column:1/-1}.detail-question{font-family:"Hind Siliguri",Inter,sans-serif;font-size:17px;line-height:1.8;white-space:pre-wrap}.option{display:flex;gap:9px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}.option.selected{border-color:var(--blue);background:#eff6ff}.option input{accent-color:var(--blue)}.quiz-progress{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.quiz-result{text-align:center;padding:25px}.score-ring{width:126px;height:126px;border-radius:50%;display:grid;place-items:center;margin:15px auto;background:conic-gradient(var(--green) 0 var(--score),#e7eef8 var(--score) 100%);position:relative}.score-ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:white}.score-ring b{position:relative;font-size:27px}.profile-card{text-align:center}.profile-card .avatar{width:96px;height:96px;margin:0 auto 10px;font-size:28px}.profile-card h2{margin:0}.kv{display:grid;grid-template-columns:160px 1fr;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.mobilebar{display:none}.toast{position:fixed;bottom:22px;right:22px;background:#102d60;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:30;display:none;max-width:min(380px,90vw)}.loading{padding:50px 20px;text-align:center;color:var(--muted)}.gate{max-width:480px;margin:9vh auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;text-align:center;box-shadow:var(--shadow)}.gate h1{margin:6px 0}.gate p{color:var(--muted)}

@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:50;left:-260px;top:0;width:245px;transition:left .25s;height:100dvh;box-shadow:20px 0 50px #071f4933}.sidebar.open{left:0}.main{padding:12px 12px 88px}.topbar{gap:8px}.hamb{display:block}.search{height:42px;padding:0 10px}.profile-mini span{display:none}.profile-mini .avatar{width:34px;height:34px}.hero{padding:22px 18px;min-height:175px}.hero .hero-icon{font-size:37px;margin-right:12px}.hero-campus{width:43%;opacity:.35}.hero h1{font-size:24px}.hero p{font-size:12px;max-width:75%}.stats{gap:8px}.stat{padding:10px;gap:8px}.stat .sicon{width:34px;height:34px;font-size:16px}.stat b{font-size:17px}.tiles{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.kv{grid-template-columns:115px 1fr}.mobilebar{display:flex;position:fixed;z-index:40;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px #163d7912}.mobilebar button{border:0;background:none;color:#64748b;display:grid;gap:3px;justify-items:center;font-size:9px;font-weight:700}.mobilebar button.active{color:var(--blue)}.mobilebar span{font-size:18px}.rowitem .date{font-size:9px}.panel{padding:13px}}

<div id="root"><div class="loading">MCUN Student Portal লোড হচ্ছে…</div></div><div id="toast" class="toast"></div>
<script type="module">
import {initializeApp,getApps} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocs,query,where,addDoc,setDoc,updateDoc,deleteDoc,limit} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAgZV0TeVSXYYnQiKqGKq7N2hAWk4FU4fo',authDomain:'muc-network-50a06.firebaseapp.com',projectId:'muc-network-50a06',storageBucket:'muc-network-50a06.firebasestorage.app',messagingSenderId:'143299318658',appId:'1:143299318658:web:5bb77c759dbd075f51359b'};
const app=getApps().length?getApps()[0]:initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Date(typeof t==='number'?t:t.seconds? t.seconds*1000:t).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';const ts=x=>typeof x==='number'?x:x?.toMillis?x.toMillis():x?.seconds?x.seconds*1000:0;
const S={user:null,profile:null,page:'dashboard',posts:[],questions:[],quizzes:[],attempts:[],saved:[],collections:[],notifications:[],loading:false,filters:{subject:'',board:'',year:'',type:'',q:''},quiz:null,quizQs:[],quizKeys:{},answers:{},qi:0,startedAt:0,timer:null,seconds:0,result:null,selectedQuestion:null,resourceFilter:'All'};
const toast=m=>{const el=$('#toast');el.textContent=m;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2800)};
const SUBJECTS=['Physics','Chemistry','Biology','Higher Mathematics','ICT','Bangla','English','Accounting','Finance','Economics','Other'];const BOARDS=['Dhaka','Rajshahi','Cumilla','Jashore','Chattogram','Barishal','Sylhet','Dinajpur','Mymensingh'];
function icon(k){return ({dashboard:'⌂',updates:'◉',academic:'🎓',questions:'📖',quiz:'🏆',model:'📝',progress:'▥',library:'🔖',downloads:'⇩',communication:'✉',profile:'♙',logout:'↪',notice:'◉',routine:'▦',syllabus:'▤',result:'🏅',event:'✦'})[k]||'•'}
function gate(msg='এই ফিচার ব্যবহার করতে MCUN অ্যাকাউন্টে লগইন করুন।'){return `<div class="gate"><div style="font-size:42px">🎓</div><h1>MCUN Student Portal</h1><p>${esc(msg)}</p><a class="btn" href="/">মূল ওয়েবসাইটে Login করুন</a></div>`}
function navBtn(id,label,ic,sub=false){return `<button class="nav ${S.page===id?'active':''} ${sub?'sub':''}" onclick="Student.go('${id}')"><span class="ico">${ic}</span>${label}</button>`}
function shell(content){const p=S.profile||{};return `<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><img src="/logo.png" alt="MCUN"><div><strong>MCUN</strong><small>Mirpur College<br>Updates & Notices</small></div></div><div class="nav-label">MAIN MENU</div>${navBtn('dashboard','Dashboard',icon('dashboard'))}${navBtn('updates','College Updates',icon('updates'))}<div class="nav-label">ACADEMIC HUB</div>${navBtn('academic','Academic Hub',icon('academic'))}${navBtn('questions','Board Questions',icon('questions'),true)}${navBtn('quiz','Quiz & Exam',icon('quiz'),true)}${navBtn('resources','Study Resources','📚',true)}<div class="nav-label">MY LEARNING</div>${navBtn('learning','My Learning',icon('progress'))}${navBtn('results','My Results','🏅',true)}${navBtn('library','My Library',icon('library'))}${navBtn('downloads','Downloads',icon('downloads'))}${navBtn('communication','Communication',icon('communication'))}<div class="nav-label">ACCOUNT</div>${navBtn('profile','My Profile',icon('profile'))}<div class="side-bottom"><b>${esc(p.name||'Student')}</b><br>${esc(p.year||'')} · ${esc(p.dept||'')}<br><button class="nav" style="margin-top:14px;padding-left:0" onclick="Student.logout()">↪ Log out</button></div></aside><section class="main"><div class="topbar"><button class="hamb" onclick="Student.menu()">☰</button><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Search questions, notices, quizzes..." onkeydown="if(event.key==='Enter')Student.search(this.value)"></div><div class="top-actions"><button class="btn ghost" onclick="Student.go('communication')">🔔</button><div class="profile-mini"><div class="avatar">${p.photo?`<img src="${esc(p.photo)}">`:esc((p.name||'S').slice(0,1).toUpperCase())}</div><span>${esc(p.name||'Student')}<br><small class="muted">${esc(p.year||'')}</small></span></div></div></div>${content}<footer style="padding:24px 4px 0;color:#8290a8;font-size:10px;text-align:center">© ${new Date().getFullYear()} MCUN · Mirpur College Updates & Notices · Connect • Learn • Grow</footer></section></div><nav class="mobilebar">${[['dashboard','Home','⌂'],['questions','Questions','📖'],['quiz','Quiz','🏆'],['learning','Progress','▥'],['profile','Profile','♙']].map(([id,l,i])=>`<button class="${S.page===id?'active':''}" onclick="Student.go('${id}')"><span>${i}</span>${l}</button>`).join('')}</nav>`}
function hero(title,desc,emoji='🎓'){return `<section class="hero"><div class="hero-icon">${emoji}</div><div class="hero-copy"><h1>${title}</h1><p>${desc}</p></div><img class="hero-campus" src="/og.png" alt="Mirpur College campus"></section>`}
function stat(n,l,ic){return `<div class="stat"><div class="sicon">${ic}</div><div><b>${n}</b><small>${l}</small></div></div>`}
function dashboard(){const p=S.profile||{},a=S.attempts,done=a.length,best=a.length?Math.max(...a.map(x=>x.percentage||0)):0;return `${hero(`Welcome Back, ${esc(p.name||'Student')}!`,'Keep learning, keep growing. Your academic journey with MCUN is always here to support you.','🎓')}<div class="stats">${stat(S.posts.length,'College Updates','📢')}${stat(S.questions.length,'Board Questions','📖')}${stat(done,'Quizzes Completed','🏆')}${stat(best+'%','Best Score','⭐')}</div><div class="layout"><div><section class="panel"><div class="panel-head"><h2>Quick Access</h2><span class="muted small">Explore your study tools</span></div><div class="tiles">${[['questions','Board Questions','Past papers & solutions','📚'],['quiz','Practice Quiz','Test your knowledge','🏆'],['learning','My Progress','Track performance','📈'],['library','My Library','Saved questions','🔖'],['resources','Study Resources','Syllabus & guides','📘'],['downloads','Downloads','Available files','⇩']].map(x=>`<button class="tile" onclick="Student.go('${x[0]}')"><span class="ticon">${x[3]}</span><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>Latest College Updates</h2><button class="btn secondary" onclick="Student.go('updates')">View all →</button></div>${postList(S.posts.slice(0,5))}</section></div><div><section class="panel"><div class="panel-head"><h2>Upcoming & Important</h2><span>📅</span></div>${postList(S.posts.filter(x=>x.cat==='routine'||x.cat==='notice').slice(0,4))}</section><section class="panel"><div class="panel-head"><h2>Learning Snapshot</h2></div><div style="display:flex;align-items:center;gap:16px"><div class="score-ring" style="--score:${Math.min(best,100)}%"><b>${best}%</b></div><div><b>${done} attempts</b><div class="muted small">Your recorded quiz history</div></div></div><button class="btn" style="width:100%;margin-top:12px" onclick="Student.go('learning')">View progress</button></section></div></div>`}
function postList(items){if(!items.length)return `<div class="empty"><strong>No updates yet</strong>নতুন পোস্ট প্রকাশিত হলে এখানে দেখা যাবে।</div>`;return `<div class="list">${items.map(p=>`<div class="rowitem"><span class="badge ${p.cat==='notice'?'red':p.cat==='result'?'green':''}">${esc((p.cat||'notice').toUpperCase())}</span><div style="min-width:0;flex:1"><h4>${esc(p.title)}</h4><p>${esc(String(p.body||'').replace(/<[^>]*>/g,' ').slice(0,110))}</p><small class="muted">${fmt(ts(p.ts))}</small></div><button class="btn secondary" onclick="Student.post('${esc(p.id)}')">View</button></div>`).join('')}</div>`}
function updates(){const cats=['All','notice','syllabus','suggestion','routine','result','event'];let list=S.posts.filter(p=>S.resourceFilter==='All'||p.cat===S.resourceFilter);return `${hero('College Updates','Stay informed with notices, syllabus, routines, results and events.','📢')}<div class="tabs">${cats.map(c=>`<button class="tab ${S.resourceFilter===c?'active':''}" onclick="Student.setPostFilter('${c}')">${c==='All'?'All Updates':c[0].toUpperCase()+c.slice(1)}</button>`).join('')}</div><section class="panel">${postList(list)}</section>`}
function academic(){return `${hero('Academic Hub','Explore board questions, practice quizzes and study resources in one place.','🎓')}<div class="tiles" style="margin-bottom:16px">${[['questions','Board Question Bank','Browse by board, year & subject','📖'],['quiz','Quiz & Exam','Practice and timed exams','🏆'],['resources','Study Resources','Syllabus, suggestions and guides','📚'],['learning','My Learning','Your progress and performance','📈']].map(x=>`<button class="tile" onclick="Student.go('${x[0]}')"><span class="ticon">${x[3]}</span><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div><div class="layout"><section class="panel"><div class="panel-head"><h2>Recent Board Questions</h2><button class="btn secondary" onclick="Student.go('questions')">Browse all →</button></div>${questionList(S.questions.slice(0,4))}</section><section class="panel"><div class="panel-head"><h2>Available Quizzes</h2></div>${quizList(S.quizzes.slice(0,4))}</section></div>`}
function questionList(items){if(!items.length)return `<div class="empty"><strong>No published questions yet</strong>প্রশ্ন প্রকাশিত হলে এখানে পাওয়া যাবে।</div>`;return items.map(q=>`<article class="qcard"><div class="qmeta"><span class="badge">${esc(q.type||'Question')}</span><span>${esc(q.subject||'')}</span><span>${esc(q.board||'')}</span><span>${esc(q.year||'')}</span></div><h3>${esc(q.title||q.question?.slice(0,95)||'Board Question')}</h3><div class="qmeta">${esc(q.chapter||'Chapter not specified')} · ${q.marks||1} marks · ${fmt(ts(q.createdAt))}</div><div class="qactions"><button class="btn" onclick="Student.openQuestion('${esc(q.id)}')">View Question</button><button class="btn secondary" onclick="Student.saveQuestion('${esc(q.id)}')">☆ Save</button></div></article>`).join('')}
function questions(){const f=S.filters;let items=S.questions.filter(q=>(!f.subject||q.subject===f.subject)&&(!f.board||q.board===f.board)&&(!f.year||String(q.year)===f.year)&&(!f.type||q.type===f.type)&&(!f.q||[q.title,q.question,q.chapter,q.subject,q.board].join(' ').toLowerCase().includes(f.q.toLowerCase())));return `${hero('Board Question Bank','Search previous board questions by subject, board, year and chapter.','📖')}<section class="panel"><div class="filters"><input id="board-query" class="field" placeholder="Search questions..." value="${esc(f.q)}" oninput="Student.filter('q',this.value)"><select id="board-subject" onchange="Student.filter('subject',this.value)"><option value="">All Subjects</option>${SUBJECTS.map(x=>`<option ${f.subject===x?'selected':''}>${x}</option>`).join('')}</select><select id="board-board" onchange="Student.filter('board',this.value)"><option value="">All Boards</option>${BOARDS.map(x=>`<option ${f.board===x?'selected':''}>${x}</option>`).join('')}</select><select id="board-year" onchange="Student.filter('year',this.value)"><option value="">All Years</option>${[2026,2025,2024,2023,2022,2021,2020].map(x=>`<option ${f.year===String(x)?'selected':''}>${x}</option>`).join('')}</select><select id="board-type" onchange="Student.filter('type',this.value)"><option value="">All Types</option><option value="MCQ" ${f.type==='MCQ'?'selected':''}>MCQ</option><option value="CQ" ${f.type==='CQ'?'selected':''}>CQ</option></select></div><div class="muted small" style="margin-bottom:10px">${items.length} questions found</div>${questionList(items)}</section>`}
function quizList(items){if(!items.length)return `<div class="empty"><strong>No quizzes available</strong>Admin নতুন Quiz প্রকাশ করলে এখানে দেখা যাবে।</div>`;return items.map(q=>`<article class="qcard"><div class="qmeta"><span class="badge ${q.mode==='exam'?'amber':''}">${esc((q.mode||'practice').toUpperCase())}</span><span>${esc(q.subject||'General')}</span><span>${q.durationMinutes||0} min</span><span>${q.questionCount||0} questions</span></div><h3>${esc(q.title)}</h3><p class="muted small">${esc(q.description||'Practice your knowledge and check your progress.')}</p><div class="qactions"><button class="btn" onclick="Student.startQuiz('${esc(q.id)}')">${q.mode==='exam'?'Start Exam':'Start Practice'}</button></div></article>`).join('')}
function quiz(){return `${hero('Quiz & Examination','Practice chapter-wise questions or take a timed model test.','🏆')}<div class="tabs"><button class="tab active">Available Quizzes</button><button class="tab" onclick="Student.go('results')">My Attempts</button></div><div class="layout"><section class="panel"><div class="panel-head"><h2>Published Quizzes</h2><span class="muted small">${S.quizzes.length} available</span></div>${quizList(S.quizzes)}</section><section class="panel"><h2>Before You Start</h2><div class="list"><div class="rowitem">📘 <div><h4>Practice Mode</h4><p>Learn at your own pace and review explanations after submission.</p></div></div><div class="rowitem">⏱️ <div><h4>Exam Mode</h4><p>Complete the test within its time limit; answers are reviewed after submission.</p></div></div><div class="rowitem">🔒 <div><h4>Secure Results</h4><p>Your score is checked by the server, not by the browser.</p></div></div></div></section></div>`}
function learning(){const a=S.attempts,best=a.length?Math.max(...a.map(x=>x.percentage||0)):0,avg=a.length?Math.round(a.reduce((s,x)=>s+(x.percentage||0),0)/a.length):0;const subs=[...new Set(a.map(x=>x.subject).filter(Boolean))];return `${hero('My Learning','Track your quiz activity and review your academic progress.','📈')}<div class="stats">${stat(a.length,'Quiz Attempts','🏆')}${stat(best+'%','Best Score','⭐')}${stat(avg+'%','Average Score','📊')}${stat(a.reduce((s,x)=>s+(x.totalQuestions||0),0),'Questions Attempted','📖')}</div><div class="layout"><section class="panel"><div class="panel-head"><h2>Recent Performance</h2><button class="btn secondary" onclick="Student.go('results')">All results →</button></div>${a.length?a.slice(0,8).map(x=>`<div class="rowitem"><span class="badge green">${x.percentage||0}%</span><div style="flex:1"><h4>${esc(x.quizTitle||'Quiz')}</h4><p>${esc(x.subject||'General')} · ${x.correct||0}/${x.totalQuestions||0} correct</p></div><span class="date">${fmt(ts(x.createdAt))}</span></div>`).join(''):`<div class="empty"><strong>Your learning journey starts here</strong>প্রথম Quiz সম্পন্ন করলে অগ্রগতি এখানে দেখা যাবে।<button class="btn" onclick="Student.go('quiz')" style="margin-top:12px">Explore quizzes</button></div>`}</section><section class="panel"><h2>Subject-wise Activity</h2>${subs.length?subs.map(s=>{const n=a.filter(x=>x.subject===s).length;return `<div style="margin:16px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><b>${esc(s)}</b><span>${n} attempts</span></div><div class="progress"><i style="width:${Math.min(100,n*12)}%"></i></div></div>`}).join(''):`<div class="empty">কোনো subject activity নেই।</div>`}</section></div>`}
function results(){return `${hero('My Results','Review your submitted quizzes and examination scores.','🏅')}<section class="panel"><div class="panel-head"><h2>Quiz History</h2><span class="muted small">${S.attempts.length} attempts</span></div>${S.attempts.length?S.attempts.map(a=>`<div class="rowitem"><span class="badge ${a.percentage>=40?'green':'red'}">${a.percentage||0}%</span><div style="flex:1"><h4>${esc(a.quizTitle||'Quiz')}</h4><p>${esc(a.subject||'General')} · ${a.correct||0} correct · ${a.incorrect||0} incorrect · ${a.totalQuestions||0} total</p></div><span class="date">${fmt(ts(a.createdAt))}</span></div>`).join(''):`<div class="empty"><strong>No results yet</strong>তুমি Quiz সম্পন্ন করলে ফলাফল এখানে দেখা যাবে।</div>`}</section>`}
function library(){return `${hero('My Library','Your saved questions, bookmarks and study collections.','🔖')}<div class="tabs"><button class="tab active">Saved Questions (${S.saved.length})</button><button class="tab" onclick="Student.go('questions')">Browse Questions</button></div><section class="panel">${S.saved.length?S.saved.map(x=>`<div class="rowitem"><span class="badge">${esc(x.type||'Question')}</span><div style="flex:1"><h4>${esc(x.title||x.questionId)}</h4><p>${esc(x.subject||'')} · ${esc(x.board||'')} · ${esc(x.year||'')}</p></div><button class="btn secondary" onclick="Student.openQuestion('${esc(x.questionId)}')">View</button><button class="btn danger" onclick="Student.unsave('${esc(x.questionId)}')">Remove</button></div>`).join(''):`<div class="empty"><strong>Your library is empty</strong>Board Question Bank থেকে গুরুত্বপূর্ণ প্রশ্ন Save করলে এখানে পাওয়া যাবে।<button class="btn" style="margin-top:12px" onclick="Student.go('questions')">Browse Questions</button></div>`}</section>`}
function resources(){const items=S.posts.filter(p=>['syllabus','suggestion'].includes(p.cat));return `${hero('Study Resources','Browse syllabus, suggestions and study materials shared by the college.','📚')}<section class="panel">${postList(items)}</section>`}
function downloads(){const items=S.posts.filter(p=>Array.isArray(p.files)&&p.files.length);return `${hero('Downloads','Open study materials and resource links shared in college updates.','⇩')}<section class="panel">${items.length?items.map(p=>`<article class="qcard"><h3>${esc(p.title)}</h3><p class="muted small">${esc(p.cat||'Resource')} · ${fmt(ts(p.ts))}</p>${(p.files||[]).map(f=>`<div class="rowitem"><div style="flex:1"><b>${esc(f.name||'Attachment')}</b><p>${esc(f.url||'')}</p></div><a class="btn" href="${esc(f.url)}" target="_blank" rel="noopener">Open / Download</a></div>`).join('')}</article>`).join(''):`<div class="empty"><strong>No downloadable resources found</strong>নতুন attachment যুক্ত হলে এখানে দেখা যাবে।</div>`}</section>`}
function communication(){const items=S.notifications||[];return `${hero('Communication','Your notifications and important college messages.','✉')}<section class="panel"><div class="panel-head"><h2>Notifications & Messages</h2><span class="muted small">${items.length} recent updates</span></div>${items.length?`<div class="list">${items.map(n=>`<div class="rowitem"><span class="badge ${n.urgent?'red':'green'}">${n.urgent?'URGENT':esc(n.kind||'UPDATE')}</span><div style="flex:1;min-width:0"><h4>${esc(n.title||'MCUN Update')}</h4><p>${esc(n.body||'')}</p><small class="muted">${fmt(ts(n.ts))}</small></div>${n.url?`<a class="btn secondary" href="${esc(n.url)}" ${/^https:\/\//i.test(n.url)?'target="_blank" rel="noopener"':''}>Open</a>`:''}</div>`).join('')}</div>`:`<div class="empty"><strong>You are all caught up</strong>নতুন নোটিশ বা Admin-এর বার্তা এলে এখানে দেখা যাবে।</div>`}</section><section class="panel"><div class="panel-head"><h2>Latest College Updates</h2><button class="btn secondary" onclick="Student.go('updates')">View updates →</button></div>${postList(S.posts.slice(0,5))}</section>`}
function profile(){const p=S.profile||{};return `${hero('My Profile','Manage your personal and academic information.','♙')}<div class="layout"><section class="panel profile-card"><div class="avatar">${p.photo?`<img src="${esc(p.photo)}">`:esc((p.name||'S').slice(0,1).toUpperCase())}</div><h2>${esc(p.name||'Student')}</h2><p class="muted">${esc(p.year||'')} · ${esc(p.dept||'')}</p><span class="badge green">Active Student</span><div style="margin-top:16px"><button class="btn secondary" onclick="Student.editProfile()">Edit Profile</button></div></section><section class="panel"><h2>Academic Information</h2>${[['Email',p.email||S.user?.email],['College','Mirpur College'],['Class',p.year],['Department',p.dept],['Joined',fmt(ts(p.createdAt)||Date.now())]].map(([k,v])=>`<div class="kv"><span class="muted">${k}</span><b>${esc(v||'—')}</b></div>`).join('')}</section></div>`}
function detail(){const q=S.selectedQuestion;if(!q)return questions();return `${hero('Question Details','Board question and verified learning notes.','📖')}<section class="panel"><div class="qmeta"><span class="badge">${esc(q.type||'Question')}</span><span>${esc(q.subject||'')}</span><span>${esc(q.board||'')}</span><span>${esc(q.year||'')}</span></div><h2 style="margin:12px 0">${esc(q.title||'Board Question')}</h2><div class="detail-question">${esc(q.question||'')}</div>${Array.isArray(q.options)&&q.options.length?`<div style="margin-top:15px">${q.options.map((o,i)=>`<div class="option"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</div>`).join('')}</div>`:''}<div class="qactions"><button class="btn" onclick="Student.saveQuestion('${esc(q.id)}')">☆ Save Question</button><button class="btn secondary" onclick="Student.go('questions')">Back to Questions</button></div>${q.correctAnswer?`<div class="panel" style="margin-top:16px;background:#f0f7ff"><h3>Correct Answer</h3><p><b>${esc(q.correctAnswer)}</b></p></div>`:''}${q.solution||q.explanation?`<div class="panel" style="margin-top:16px;background:#f6faff"><h3>Answer & Solution</h3><p style="white-space:pre-wrap">${esc(q.solution||q.explanation)}</p></div>`:''}</section>`}
function quizRunner(){const q=S.quizQs[S.qi];if(!q)return `<section class="panel empty">Loading quiz question…</section>`;const total=S.quizQs.length,remaining=S.quiz?.durationMinutes?Math.max(0,S.quiz.durationMinutes*60-S.seconds):null;return `<section class="panel"><div class="quiz-progress"><div><span class="badge">${esc(S.quiz.mode||'practice').toUpperCase()}</span><b style="margin-left:8px">${esc(S.quiz.title)}</b></div><b>${remaining===null?'Untimed':`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`}</b></div><div class="progress"><i style="width:${(S.qi+1)/total*100}%"></i></div><div class="muted small" style="margin:12px 0">Question ${S.qi+1} of ${total} · ${q.marks||1} mark(s)</div><h2 class="detail-question">${esc(q.question)}</h2>${(q.options||[]).map((o,i)=>`<label class="option ${S.answers[q.id]===String.fromCharCode(65+i)?'selected':''}"><input type="radio" name="quizop" ${S.answers[q.id]===String.fromCharCode(65+i)?'checked':''} onchange="Student.answer('${esc(q.id)}',this.value)" value="${String.fromCharCode(65+i)}">${String.fromCharCode(65+i)}. ${esc(o)}</label>`).join('')}<div class="qactions" style="justify-content:space-between"><button class="btn secondary" ${S.qi===0?'disabled':''} onclick="Student.move(-1)">← Previous</button><span class="muted small">${Object.keys(S.answers).length} answered</span>${S.qi<total-1?`<button class="btn" onclick="Student.move(1)">Next →</button>`:`<button class="btn" onclick="Student.submitQuiz()">Submit Quiz</button>`}</div></section>`}
function resultView(){const r=S.result;if(!r)return results();return `${hero('Quiz Result','Your submitted attempt has been checked.','🏅')}<section class="panel quiz-result"><div class="badge green">Submitted</div><div class="score-ring" style="--score:${r.percentage||0}%"><b>${r.percentage||0}%</b></div><h2>${esc(r.quizTitle||'Quiz')}</h2><p class="muted">${r.correct||0} correct · ${r.incorrect||0} incorrect · ${r.totalQuestions||0} questions</p><button class="btn" onclick="Student.go('results')">View All Results</button></section>${r.review?`<section class="panel"><h2>Answer Review</h2>${r.review.map(x=>`<div class="rowitem"><div style="flex:1"><h4>${esc(x.question)}</h4><p>Your answer: ${esc(Array.isArray(x.yourAnswer)?x.yourAnswer.join(', '):x.yourAnswer||'Not answered')}</p><p>Correct answer: <b>${esc(Array.isArray(x.correctAnswer)?x.correctAnswer.join(', '):x.correctAnswer)}</b></p><p>${esc(x.explanation||'')}</p></div><span class="badge ${x.isCorrect?'green':'red'}">${x.isCorrect?'Correct':'Review'}</span></div>`).join('')}</section>`:''}`}
function render(){if(!S.user){$('#root').innerHTML=gate();return}let content='';switch(S.page){case'dashboard':content=dashboard();break;case'updates':content=updates();break;case'academic':content=academic();break;case'questions':content=questions();break;case'question-detail':content=detail();break;case'quiz':content=S.quiz?quizRunner():quiz();break;case'learning':content=learning();break;case'results':content=S.result?resultView():results();break;case'library':content=library();break;case'resources':content=resources();break;case'downloads':content=downloads();break;case'communication':content=communication();break;case'profile':content=profile();break;default:content=dashboard()}$('#root').innerHTML=shell(content)}
async function loadAll(){S.loading=true;render();try{const [postSn,qSn,quizSn,attemptSn,savedSn,notifSn,allNotifSn]=await Promise.all([
 getDocs(collection(db,'posts')),
 getDocs(query(collection(db,'boardQuestions'),where('status','==','published'),limit(100))),
 getDocs(query(collection(db,'quizSets'),where('status','==','published'),limit(50))),
 getDocs(query(collection(db,'quizAttempts'),where('uid','==',S.user.uid),limit(100))),
 getDocs(collection(db,'users',S.user.uid,'savedQuestions')),
 getDocs(query(collection(db,'users',S.user.uid,'inbox'),limit(30))).catch(()=>({docs:[]})),
 getDocs(query(collection(db,'notifAll'),limit(30))).catch(()=>({docs:[]}))
 ]);
 S.posts=postSn.docs.map(d=>({id:d.id,...d.data()})).filter(p=>!p.draft&&!(p.at&&ts(p.at)>Date.now())&&!(p.dl&&ts(p.dl)<Date.now())).sort((a,b)=>ts(b.ts)-ts(a.ts));
 S.questions=qSn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ts(b.createdAt)-ts(a.createdAt));
 S.quizzes=quizSn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ts(b.createdAt)-ts(a.createdAt));
 S.attempts=attemptSn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ts(b.createdAt)-ts(a.createdAt));
 S.saved=savedSn.docs.map(d=>({id:d.id,...d.data()}));S.notifications=[...notifSn.docs.map(d=>({id:d.id,...d.data()})),...allNotifSn.docs.map(d=>({id:d.id,...d.data()}))].sort((a,b)=>ts(b.ts)-ts(a.ts)).slice(0,50);
 }catch(e){console.error(e);toast('কিছু ডেটা লোড হয়নি: '+(e.code||e.message));}
 S.loading=false;render()}
const Student={go(page){if(S.timer){clearInterval(S.timer);S.timer=null}if(page!=='quiz'){S.quiz=null;S.quizQs=[];S.result=null}S.page=page;render();if(innerWidth<700)$('#sidebar')?.classList.remove('open')},menu(){ $('#sidebar').classList.toggle('open')},logout:async()=>{await signOut(auth);location.href='/'},search(v){S.filters.q=v;S.page='questions';render()},setPostFilter(v){S.resourceFilter=v;render()},filter(k,v){const a=document.activeElement,id=a&&a.id,pos=a&&typeof a.selectionStart==='number'?a.selectionStart:null;S.filters[k]=v;S.page='questions';render();const b=id?document.getElementById(id):null;if(b){b.focus();try{if(pos!==null)b.setSelectionRange(pos,pos)}catch(_){}}},post(id){const p=S.posts.find(x=>x.id===id);if(p){alert(p.title+'\n\n'+String(p.body||'').replace(/<[^>]*>/g,' '))}},async openQuestion(id){let q=S.questions.find(x=>x.id===id);if(!q){try{const snap=await getDoc(doc(db,'boardQuestions',id));if(snap.exists())q={id:snap.id,...snap.data()}}catch(e){toast('Question load হয়নি: '+e.code);return}}if(!q){toast('Question আর প্রকাশিত নেই।');return}S.selectedQuestion=q;S.page='question-detail';render()},saveQuestion:async(id)=>{if(!S.user)return;const q=S.questions.find(x=>x.id===id);if(!q)return;try{await setDoc(doc(db,'users',S.user.uid,'savedQuestions',id),{questionId:id,title:q.title||q.question?.slice(0,100)||'Question',subject:q.subject||'',board:q.board||'',year:q.year||'',type:q.type||'',savedAt:Date.now()});await loadSaved();toast('Question saved to My Library')}catch(e){toast('Save হয়নি: '+e.code)}},unsave:async(id)=>{try{await deleteDoc(doc(db,'users',S.user.uid,'savedQuestions',id));await loadSaved();render()}catch(e){toast('Remove হয়নি: '+e.code)}},answer(id,value){S.answers[id]=value;render()},move(n){S.qi=Math.max(0,Math.min(S.quizQs.length-1,S.qi+n));render()},
 startQuiz:async(id)=>{const quiz=S.quizzes.find(x=>x.id===id);if(!quiz)return;try{const token=await S.user.getIdToken(),sr=await fetch('/api/academic',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'startQuiz',quizId:id})}),sj=await sr.json();if(!sr.ok||!sj.ok)throw new Error(sj.error||'Quiz start failed');const sn=await getDocs(query(collection(db,'quizQuestions'),where('quizId','==',id)));S.quizQs=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));if(!S.quizQs.length){toast('এই Quiz-এ প্রশ্ন নেই');return}S.quiz=quiz;S.sessionId=sj.sessionId;S.answers={};S.qi=0;S.startedAt=sj.startedAt;S.expiresAt=sj.expiresAt;S.seconds=0;S.result=null;S.page='quiz';render();if(sj.durationMinutes){S.timer=setInterval(()=>{S.seconds=Math.floor((Date.now()-S.startedAt)/1000);if(Date.now()>=S.expiresAt){Student.submitQuiz()}else if(S.page==='quiz'&&S.quiz)render()},1000)}}catch(e){toast('Quiz load হয়নি: '+e.message)}},
 submitQuiz:async()=>{if(!S.quiz||!S.user||S.submitting)return;S.submitting=true;if(S.timer){clearInterval(S.timer);S.timer=null}try{const token=await S.user.getIdToken(),res=await fetch('/api/academic',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'submitQuiz',quizId:S.quiz.id,sessionId:S.sessionId,answers:S.answers})});const j=await res.json();if(!res.ok||!j.ok)throw new Error(j.error||'Submission failed');S.result=j.result;S.attempts.unshift(j.result);S.quiz=null;S.quizQs=[];S.page='results';S.submitting=false;render()}catch(e){S.submitting=false;toast('Submit হয়নি: '+e.message);}},
 editProfile:async()=>{const p=S.profile||{};const name=prompt('আপনার নাম',p.name||'');if(!name||!name.trim())return;try{await updateDoc(doc(db,'users',S.user.uid),{name:name.trim().slice(0,80),updated:Date.now()});S.profile={...p,name:name.trim()};render();toast('Profile updated')}catch(e){toast('Update হয়নি: '+e.code)}}};
