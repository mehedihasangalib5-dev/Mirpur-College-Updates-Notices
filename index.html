<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="logo.png"><meta name="theme-color" content="#1d3fa8"><title>Mirpur College Updates &amp; Notices</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5fb;--card:#fff;--ink:#17152b;--mute:#6b6885;--line:#e7e4f3;--pri:#1d3fa8;--pri2:#3f6ae0;--sh:0 8px 30px rgba(60,40,140,.09)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d1a;--card:#171528;--ink:#f1efff;--mute:#9a97b8;--line:#2a2745;--sh:0 8px 30px rgba(0,0,0,.4);--pri:#6b8cff;--pri2:#9db6ff}}
:root[data-theme="dark"]{--bg:#0e0d1a;--card:#171528;--ink:#f1efff;--mute:#9a97b8;--line:#2a2745;--sh:0 8px 30px rgba(0,0,0,.4);--pri:#6b8cff;--pri2:#9db6ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,"Segoe UI","Noto Sans Bengali",system-ui,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 85%,transparent);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:6px;height:62px}.sp{flex:1}
.logo{font-weight:800;font-size:19px;display:flex;gap:9px;align-items:center;margin-right:10px;color:var(--ink);text-decoration:none}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff;font-style:normal}
.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.links a{padding:7px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:600;white-space:nowrap}
.links a.on,.links a:hover{background:var(--card);color:var(--ink)}
button,.btn{font:inherit;cursor:pointer;border:0}
.btn{display:inline-block;padding:9px 16px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:600;text-decoration:none;box-shadow:0 6px 18px rgba(29,63,168,.3);transition:.2s}
.btn:hover{transform:translateY(-1px)}.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.danger{background:#ff4d6d;box-shadow:none}.sm{padding:6px 11px;font-size:13px;box-shadow:none}
.hero{padding:44px 0 22px;text-align:center}.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0 0 10px;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);margin:0 auto 20px;max-width:520px}
.search{max-width:520px;margin:auto;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--sh)}
.search input{flex:1;border:0;background:none;color:var(--ink);font:inherit;outline:0}
h2.t{margin:26px 0 12px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:.2s}
.cat:hover{transform:translateY(-3px);box-shadow:var(--sh)}.cat b{font-size:24px;display:block}.cat small{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-bottom:50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;transition:.25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.card img{width:100%;height:150px;object-fit:cover;display:block}.cb{padding:16px;display:flex;flex-direction:column;gap:7px;flex:1}
.tag{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.card h3{margin:0;font-size:17px;line-height:1.35}
.card p{margin:0;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px;margin-top:auto;padding-top:6px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
.modal{position:fixed;inset:0;background:rgba(10,8,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20;backdrop-filter:blur(4px)}
.modal.open{display:flex}.sheet{background:var(--card);border-radius:24px;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:26px;animation:up .25s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.sheet img.big{width:100%;border-radius:14px;margin:8px 0}.body{white-space:pre-wrap;word-break:break-word}
.file{display:flex;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;color:var(--ink);text-decoration:none}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:120px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.adm{display:grid;gap:20px;padding-bottom:50px}@media(min-width:900px){.adm{grid-template-columns:400px 1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:20px}.panel h3{margin-top:0}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.li:last-child{border:0}
.li div{flex:1;min-width:140px}.li b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}small{color:var(--mute)}
.note{background:color-mix(in srgb,var(--pri) 10%,transparent);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--mute);margin-bottom:14px}
code{background:var(--bg);padding:3px 8px;border-radius:8px;border:1px solid var(--line);word-break:break-all;font-size:12.5px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:50;display:none}
footer{text-align:center;color:var(--mute);padding:26px 0;border-top:1px solid var(--line);font-size:13px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.two{grid-template-columns:1fr}.links{display:none}.logo{font-size:15px}}
button.cat{font:inherit;text-align:left;width:100%;cursor:pointer}.cat.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
#list{scroll-margin-top:80px}h2.t small{font-weight:500}
.auth{display:grid;grid-template-columns:1fr;max-width:920px;margin:34px auto 50px;border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(60,40,140,.22);border:1px solid var(--line);background:var(--card)}
@media(min-width:800px){.auth{grid-template-columns:1.05fr 1fr}}
.auth-side{position:relative;overflow:hidden;padding:38px 32px;color:#fff;background:linear-gradient(145deg,#0f2a7a,#1d3fa8 55%,#3f6ae0)}
.blob{position:absolute;border-radius:50%;opacity:.25;background:#fff}.b1{width:220px;height:220px;top:-70px;right:-60px}.b2{width:160px;height:160px;bottom:-50px;left:-40px}
.auth-side>*{position:relative}.auth-side h2{font-size:30px;margin:26px 0 8px;line-height:1.2}.auth-side p{opacity:.85;margin:0}
.auth-side ul{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px}.auth-side li{background:rgba(255,255,255,.15);padding:10px 14px;border-radius:14px}
.auth-brand{display:flex;gap:10px;align-items:center;font-weight:800}.auth-brand i{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-style:normal}
.auth-card{padding:34px 30px}.tabs{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;padding:9px;border-radius:11px;background:none;color:var(--mute);font-weight:700}.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.1)}
.fld{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 12px;transition:.2s}
.fld:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent)}
.fld input{border:0;background:none;outline:0;padding:12px 0}.eye{background:none;color:var(--mute)}
.err{color:#e5484d;font-size:13px;min-height:20px;margin:8px 0}.wide{width:100%;padding:13px;font-size:16px}.lnk{background:none;color:var(--pri);font-weight:600;padding:0}
footer a{color:var(--pri);font-weight:700;text-decoration:none}footer a:hover{text-decoration:underline}
.logo img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff}
.hero-logo{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;display:block;box-shadow:0 12px 34px rgba(29,63,168,.35)}
.auth-brand img{width:48px;height:48px;border-radius:50%;background:#fff}
.auth-brand{font-size:17px;line-height:1.25}
</style></head><body>
<header><div class="wrap nav">
 <a class="logo" href="#/"><img src="logo.png" alt="Logo">Mirpur College Updates &amp; Notices</a>
 <nav class="links" id="links"></nav><div class="sp"></div>
 <button class="btn ghost sm" id="theme">🌓</button>
 <button class="btn ghost sm" id="loginBtn" onclick="openLogin()">🔐 Login</button>
 <a class="btn sm" id="admBtn" href="#/admin" style="display:none">⚙ Admin</a>
</div></header>
<main class="wrap" id="app"></main>
<footer><img src="logo.png" alt="Logo" style="width:54px;height:54px;border-radius:50%;margin-bottom:8px"><div>© <span id="yr"></span> Mirpur College Updates &amp; Notices. All rights reserved.</div>
<div>Developed by <a href="https://cortex-it-kappa.vercel.app/" target="_blank" rel="noopener">Cortex IT</a></div>
<div style="margin-top:6px"><a href="#/">Home</a> · <a href="#/contact">Contact</a></div><div id="uidf" style="margin-top:6px"></div></footer>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>

<script>
const CATS={notice:{n:"Notice",i:"📢",c:"#e5484d"},syllabus:{n:"Syllabus",i:"📚",c:"#5b4bff"},suggestion:{n:"Suggestion",i:"💡",c:"#e08a00"},routine:{n:"Routine",i:"🗓",c:"#0d9488"},result:{n:"Result",i:"🏆",c:"#16a34a"},event:{n:"Event",i:"🎉",c:"#d6409f"}};
const S={posts:[],admins:[],uid:null,owner:false,q:"",edit:null,pending:{cover:null,files:[]},col:null,cfg:null,assets:null,local:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=t=>new Date(t).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const tint=c=>`background:${c}22;color:${c}`,blob=id=>"/_blob/"+id;
const isAdmin=()=>S.local||!!(S.uid&&S.admins.includes(S.uid));
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2400)}

/* ---- data layer (Firebase) ---- */
let FB=null;
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},lset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
async function savePost(id,data){
 if(FB){id?await FB.setDoc(FB.doc(FB.db,"posts",id),data):await FB.addDoc(FB.collection(FB.db,"posts"),data)}
 else{let a=ls("ch_posts",[]);id?a=a.map(x=>x.id==id?{...data,id}:x):a.push({...data,id:"l"+Date.now()});lset("ch_posts",a);S.posts=a;route()}}
async function delPost(id){if(FB)await FB.deleteDoc(FB.doc(FB.db,"posts",id));else{S.posts=ls("ch_posts",[]).filter(x=>x.id!=id);lset("ch_posts",S.posts);route()}}
async function saveAdmins(ids){if(FB)await FB.setDoc(FB.doc(FB.db,"config","admins"),{ids});else{S.admins=ids;lset("ch_admins",ids);route()}}
function shrink(file,max,q){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};
 im.onerror=()=>rej(new Error("Image porte parini"));im.src=u})}
async function upload(file){
 if(!/^image\//.test(file.type))throw new Error("PDF/Doc upload hoy na - Google Drive link niche 'Attachment links'-e din");
 let url=await shrink(file,1000,.72);if(url.length>260000)url=await shrink(file,800,.55);
 if(url.length>300000)throw new Error("Chobi ta onek boro, chhoto kore din");
 return{id:"",name:file.name,type:"image/jpeg",url}}
const furl=f=>f.id?blob(f.id):f.url;

/* ---- views ---- */
const sorted=l=>[...l].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||b.ts-a.ts);
function card(p){const c=CATS[p.cat]||CATS.notice;return `<div class="card" onclick="openPost('${p.id}')">${p.cover?`<img src="${esc(furl(p.cover))}" alt="">`:""}
<div class="cb"><span class="tag" style="${tint(c.c)}">${c.i} ${c.n}${p.pinned?" · 📌":""}</span><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p>
<div class="meta"><span>${fmt(p.ts).split(",")[0]}</span><span>${(p.files||[]).length?"📎 "+p.files.length:""}</span></div></div></div>`}
function match(p){return !S.q||(p.title+" "+p.body).toLowerCase().includes(S.q.toLowerCase())}
function pHome(){const l=sorted(S.posts.filter(p=>match(p)&&(!S.cat||p.cat==S.cat)));const c=CATS[S.cat];
 return `<section class="hero"><img class="hero-logo" src="logo.png" alt="Logo"><h1>সব <span>Notice, Syllabus</span><br>ও Suggestion এক জায়গায়</h1><p>Mirpur College Updates &amp; Notices-এর সর্বশেষ আপডেট, category অনুযায়ী সাজানো।</p>
 <div class="search"><span>🔍</span><input id="q" placeholder="Search করুন…" value="${esc(S.q)}"><button class="btn sm" onclick="S.q=$('#q').value.trim();route()">Search</button></div></section>
 <div class="cats"><button class="cat ${S.cat?"":"on"}" onclick="setCat(null)">🗂<b>${S.posts.length}</b><small>All</small></button>${Object.entries(CATS).map(([k,c])=>`<button class="cat ${S.cat==k?"on":""}" onclick="setCat('${k}')">${c.i}<b>${S.posts.filter(p=>p.cat==k).length}</b><small>${c.n}</small></button>`).join("")}</div>
 <h2 class="t" id="list"><span>${c?c.i+" "+c.n:"🆕 সব Latest Post"}</span><small>${l.length} টি</small></h2>
 <div class="grid">${l.length?l.map(card).join(""):'<div class="empty">এই category-তে এখনো কোনো post নেই।</div>'}</div>`}
function setCat(k){S.cat=(k&&S.cat==k)?null:k;route();const el=$("#list");el&&el.scrollIntoView({behavior:"smooth"})}
function pContact(){return `<section class="hero" style="padding-bottom:10px"><h1>📬 <span>Contact</span> করুন</h1><p>প্রশ্ন, পরামর্শ বা অভিযোগ থাকলে নিচের form-এ জানান।</p></section>
 <div class="panel" style="max-width:660px;margin:0 auto 50px"><form onsubmit="sendMsg(event)">
 <div class="two"><div><label>Name *</label><input id="c_name" required maxlength="80"></div><div><label>Email *</label><input id="c_email" type="email" required maxlength="120"></div></div>
 <div class="two"><div><label>Phone</label><input id="c_phone" maxlength="30"></div><div><label>Subject *</label><input id="c_sub" required maxlength="150"></div></div>
 <label>Message *</label><textarea id="c_msg" required minlength="5" maxlength="2000"></textarea>
 <input id="c_hp" style="display:none" tabindex="-1" autocomplete="off">
 <div class="row"><button class="btn" id="c_btn">Send Message ✈</button></div></form></div>`}
function pLogin(){
 if(S.uid)return `<section class="auth"><div class="auth-side"><div class="blob b1"></div><div class="blob b2"></div><div class="auth-brand"><img src="logo.png" alt="Logo">Mirpur College Updates &amp; Notices</div><h2>স্বাগতম 👋</h2><p>আপনি login করা আছেন।</p></div>
 <div class="auth-card"><h3 style="margin-top:0">Signed in</h3><p><small>${esc(S.email||"")}</small></p><p><small>UID:</small><br><code>${esc(S.uid)}</code></p>
 <div class="row"><a class="btn" href="#/admin">Admin Panel</a><button class="btn ghost" onclick="copy('${esc(S.uid)}')">Copy UID</button><button class="btn ghost" onclick="openLogin()">Logout</button></div></div></section>`;
 const up=S.mode=="up";
 return `<section class="auth"><div class="auth-side"><div class="blob b1"></div><div class="blob b2"></div><div class="auth-brand"><img src="logo.png" alt="Logo">Mirpur College Updates &amp; Notices</div>
 <h2>${up?"নতুন account খুলুন":"Welcome back 👋"}</h2><p>Admin panel-এ login করে notice, syllabus ও update manage করুন।</p>
 <ul><li>📢 Notice ও Syllabus post করুন</li><li>📎 File ও image upload করুন</li><li>🕘 Edit history ও restore</li></ul></div>
 <div class="auth-card"><div class="tabs"><button class="${up?"":"on"}" onclick="setMode('in')">Login</button><button class="${up?"on":""}" onclick="setMode('up')">Sign up</button></div>
 <form onsubmit="doAuth(event)"><label>Email</label><div class="fld"><span>✉</span><input id="em" type="email" required autocomplete="email" placeholder="you@example.com"></div>
 <label>Password</label><div class="fld"><span>🔒</span><input id="pw" type="password" required minlength="6" autocomplete="${up?"new-password":"current-password"}" placeholder="••••••••"><button type="button" class="eye" onclick="const i=$('#pw');i.type=i.type=='password'?'text':'password'">👁</button></div>
 ${up?`<label>Confirm Password</label><div class="fld"><span>🔒</span><input id="pw2" type="password" required minlength="6" placeholder="••••••••"></div>`:""}
 <div class="err" id="aerr"></div><button class="btn wide" id="abtn">${up?"Create Account":"Login"}</button></form>
 <div class="row" style="justify-content:space-between;margin-top:16px">${up?"<span></span>":'<button class="lnk" onclick="forgot()">Password bhule gechen?</button>'}<a class="lnk" style="text-decoration:none" href="#/">← Home</a></div></div></section>`}
function pAdmin(){
 if(!isAdmin())return `<div class="panel" style="margin-top:40px;text-align:center"><h2>🔒 Access নেই</h2><p>এই page শুধু admin-দের জন্য। Access পেতে নিচের UID টি owner-কে পাঠান:</p><code>${esc(S.uid||"unknown (sign in করুন)")}</code><div class="row" style="justify-content:center"><button class="btn sm" onclick="copy('${esc(S.uid)}')">Copy UID</button></div></div>`;
 const e=S.posts.find(p=>p.id==S.edit)||{cat:"notice",title:"",body:"",link:"",pinned:false};
 const P=S.pending;
 return `<h1 style="margin:26px 0 14px;display:flex;gap:12px;align-items:center"><img src="logo.png" alt="" style="width:44px;height:44px;border-radius:50%">Admin Panel</h1>${S.local?'<div class="note">Demo mode: shared database নেই, data শুধু এই browser-এ থাকছে।</div>':''}
 <div class="adm"><div><div class="panel"><h3>${S.edit?"✏ Post Edit":"➕ নতুন Post"}</h3>
 <label>Category</label><select id="f_cat">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${e.cat==k?"selected":""}>${c.i} ${c.n}</option>`).join("")}</select>
 <label>Title</label><input id="f_title" value="${esc(e.title)}"><label>Details</label><textarea id="f_body">${esc(e.body)}</textarea>
 <label>Cover Image</label><input type="file" id="f_cover" accept="image/*" onchange="pick('cover',this.files)">${P.cover?`<small>✔ ${esc(P.cover.name)}</small>`:""}
 <label>অতিরিক্ত ছবি (auto compress হবে)</label><input type="file" id="f_files" accept="image/*" multiple onchange="pick('files',this.files)">${P.files.map(f=>`<small>✔ ${esc(f.name)}</small>`).join("<br>")}
 <label>Attachment links (PDF/Doc – Google Drive লিংক)</label><textarea id="f_links" style="min-height:80px" placeholder="Syllabus PDF | https://drive.google.com/...&#10;Routine | https://...">${esc((e.files||[]).filter(f=>f.type=="link").map(f=>f.name+" | "+f.url).join("\n"))}</textarea><small>প্রতি লাইনে একটি: নাম | লিংক</small>
 <label>Extra Link (optional)</label><input id="f_link" value="${esc(e.link)}" placeholder="https://…">
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f_pin" style="width:auto" ${e.pinned?"checked":""}> 📌 Pin to top</label>
 <div class="row"><button class="btn" onclick="submitPost()">${S.edit?"Update":"Publish"}</button>${S.edit?'<button class="btn ghost" onclick="S.edit=null;S.pending={cover:null,files:[]};route()">Cancel</button>':""}</div></div>
 <div class="panel"><h3>👤 Admin Management (UID)</h3>
 <div class="note">আপনার UID: <code>${esc(S.uid||"-")}</code><br>কাউকে admin করতে তার UID দিন। ${S.owner?"":"(শুধু Owner পরিবর্তন করতে পারে)"}</div>
 ${S.owner?`<div class="row" style="margin:0 0 10px"><input id="newuid" placeholder="UID paste করুন" style="flex:1"><button class="btn sm" onclick="addAdmin()">Add</button></div>`:""}
 ${S.admins.map(u=>`<div class="li"><div><code>${esc(u)}</code></div>${S.owner?`<button class="btn danger sm" onclick="rmAdmin('${esc(u)}')">Remove</button>`:""}</div>`).join("")||"<small>এখনো কোনো extra admin নেই (Owner সবসময় admin)।</small>"}</div></div>
 <div class="panel"><h3>সব Post (${S.posts.length})</h3>${sorted(S.posts).map(p=>`<div class="li"><span>${(CATS[p.cat]||CATS.notice).i}</span><div><b>${esc(p.title)}</b><small>${fmt(p.ts)}${p.hist&&p.hist.length?" · ✎ "+p.hist.length+" edits":""}</small></div>
 <button class="btn ghost sm" onclick="S.edit='${p.id}';S.pending={cover:p.cover||null,files:(p.files||[]).filter(f=>f.type!='link')};route();scrollTo(0,0)">Edit</button>
 ${p.hist&&p.hist.length?`<button class="btn ghost sm" onclick="showHist('${p.id}')">History</button>`:""}<button class="btn danger sm" onclick="del('${p.id}')">Delete</button></div>`).join("")||'<small>কিছু নেই</small>'}</div></div>`}

/* ---- router ---- */
function route(){
 const h=location.hash.replace(/^#\/?/,"").split("/"),pg=h[0]||"home";
 document.body.dataset.page=pg;
 $("#links").innerHTML=`<a href="#/" class="${pg=="home"?"on":""}">Home</a><a href="#/contact" class="${pg=="contact"?"on":""}">Contact</a>`;
 $("#admBtn").style.display=isAdmin()?"":"none";$("#yr").textContent=new Date().getFullYear();
 $("#uidf").innerHTML=S.uid?`Signed in: ${esc(S.email||"")}`:"";
 const k=document.activeElement&&document.activeElement.id;
 $("#app").innerHTML=pg=="admin"?pAdmin():pg=="login"?pLogin():pg=="contact"?pContact():pHome();
 const q=$("#q");if(q){q.addEventListener("keydown",e=>{if(e.key=="Enter"){S.q=q.value.trim();route()}});if(k=="q")q.focus()}
}
addEventListener("hashchange",()=>{route();scrollTo(0,0)});

/* ---- actions ---- */
function copy(t){navigator.clipboard&&navigator.clipboard.writeText(t);toast("Copied")}
async function pick(kind,files){
 try{toast("Uploading…");for(const f of files){const r=await upload(f);const tot=(S.pending.cover?S.pending.cover.url.length:0)+S.pending.files.reduce((a,x)=>a+x.url.length,0)+r.url.length;if(tot>820000)throw new Error("Ek post-e onek beshi chobi (max ~800KB)");if(kind=="cover")S.pending.cover=r;else S.pending.files.push(r)}
 const keep={t:$("#f_title").value,b:$("#f_body").value,l:$("#f_link").value,k:$("#f_links").value,c:$("#f_cat").value,p:$("#f_pin").checked};route();
 $("#f_title").value=keep.t;$("#f_body").value=keep.b;$("#f_link").value=keep.l;$("#f_links").value=keep.k;$("#f_cat").value=keep.c;$("#f_pin").checked=keep.p;toast("Uploaded ✔")}
 catch(e){toast("Upload হয়নি: "+(e.message||e.code))}
}
async function submitPost(){
 const title=$("#f_title").value.trim(),body=$("#f_body").value.trim();if(!title||!body)return toast("Title আর Details দিন");
 const old=S.posts.find(p=>p.id==S.edit),now=Date.now();
 const data={title,body,cat:$("#f_cat").value,link:$("#f_link").value.trim(),pinned:$("#f_pin").checked,cover:S.pending.cover||null,files:[...S.pending.files,...$('#f_links').value.split('\n').map(x=>x.split('|')).filter(a=>a.length>1&&/^https?:\/\//.test(a[1].trim())).map(a=>({id:'',name:a[0].trim()||'Attachment',type:'link',url:a[1].trim()}))],ts:old?old.ts:now,by:old?old.by:S.uid||"local",hist:old?[{ts:now,by:S.uid||"local",title:old.title,body:old.body,cat:old.cat,link:old.link},...(old.hist||[])].slice(0,20):[]};
 try{await savePost(S.edit,data);toast(S.edit?"Updated ✔":"Published ✔");S.edit=null;S.pending={cover:null,files:[]};route()}catch(e){toast("Save হয়নি: "+(e.message||e.code))}
}
async function del(id){if(confirm("Delete করবেন?"))try{await delPost(id);toast("Deleted")}catch(e){toast("Delete হয়নি")}}
const addAdmin=()=>{const v=$("#newuid").value.trim();if(v&&!S.admins.includes(v))saveAdmins([...S.admins,v]).catch(()=>toast("Save হয়নি"))};
const rmAdmin=u=>saveAdmins(S.admins.filter(x=>x!=u)).catch(()=>toast("Save হয়নি"));
function openPost(id){const p=S.posts.find(x=>x.id==id);if(!p)return;const c=CATS[p.cat]||CATS.notice;
 const fs=(p.files||[]).map(f=>/^image\//.test(f.type)?`<img class="big" src="${esc(furl(f))}" alt="">`:`<a class="file" href="${esc(furl(f))}" target="_blank" rel="noopener" download="${esc(f.name)}">📎 ${esc(f.name)}</a>`).join("");
 $("#sheet").innerHTML=`<span class="tag" style="${tint(c.c)}">${c.i} ${c.n}</span><h2 style="margin:8px 0">${esc(p.title)}</h2><small>${fmt(p.ts)}</small>${p.cover?`<img class="big" src="${esc(furl(p.cover))}" alt="">`:""}<p class="body">${esc(p.body)}</p>${fs}
 <div class="row">${/^https?:\/\//.test(p.link||"")?`<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">🔗 Open Link</a>`:""}<button class="btn ghost" onclick="closeM()">Close</button></div>`;$("#modal").classList.add("open")}
function showHist(id){const p=S.posts.find(x=>x.id==id);
 $("#sheet").innerHTML=`<h2 style="margin-top:0">✎ Edit History</h2>${(p.hist||[]).map((h,i)=>`<div class="li"><div><b>${esc(h.title)}</b><small>${fmt(h.ts)} · ${(CATS[h.cat]||CATS.notice).n}</small><br><small>${esc(h.body.slice(0,120))}…</small></div><button class="btn ghost sm" onclick="restore('${id}',${i})">Restore</button></div>`).join("")}<div class="row"><button class="btn ghost" onclick="closeM()">Close</button></div>`;$("#modal").classList.add("open")}
async function restore(id,i){const p=S.posts.find(x=>x.id==id),h=p.hist[i],now=Date.now();
 const d={...p};delete d.id;Object.assign(d,{title:h.title,body:h.body,cat:h.cat,link:h.link,hist:[{ts:now,by:S.uid||"local",title:p.title,body:p.body,cat:p.cat,link:p.link},...p.hist].slice(0,20)});
 try{await savePost(id,d);closeM();toast("Restored ✔")}catch(e){toast("Restore হয়নি")}}
function closeM(){$("#modal").classList.remove("open")}
$("#modal").addEventListener("click",e=>{if(e.target.id=="modal")closeM()});
$("#theme").onclick=()=>{const d=document.documentElement;d.dataset.theme=getComputedStyle(d).getPropertyValue("--bg").trim()=="#0e0d1a"?"light":"dark"};

/* ---- auth, contact, messages ---- */
S.cat=null;S.msgs=[];S.email=null;S.mode="in";
function recalc(){S.owner=!!S.uid&&S.admins[0]===S.uid}
function openLogin(){if(S.uid){FB&&FB.signOut(FB.auth);toast("Logged out");location.hash="#/"}else location.hash="#/login"}
function setMode(m){S.mode=m;route()}
function authErr(c){return({"auth/invalid-credential":"Email ba password vul.","auth/invalid-email":"Email ta thik na.","auth/email-already-in-use":"Ei email diye age-i account ache.","auth/weak-password":"Password kompokkhe 6 character dite hobe.","auth/too-many-requests":"Onek beshi try hoyeche, ektu pore abar chesta korun.","auth/network-request-failed":"Internet connection check korun.","auth/operation-not-allowed":"Firebase Console-e Email/Password sign-in enable korun."})[c]||("Error: "+c)}
async function doAuth(e){e.preventDefault();const er=$("#aerr"),b=$("#abtn");er.textContent="";
 if(!FB){er.textContent="Firebase connect hoyni.";return}
 const em=$("#em").value.trim(),pw=$("#pw").value,up=S.mode=="up";
 if(up&&pw!=$("#pw2").value){er.textContent="Password duita mile ni.";return}
 b.disabled=true;b.textContent="অপেক্ষা করুন…";
 try{up?await FB.createUserWithEmailAndPassword(FB.auth,em,pw):await FB.signInWithEmailAndPassword(FB.auth,em,pw);location.hash="#/admin"}
 catch(x){er.textContent=authErr(x.code||x.message);b.disabled=false;b.textContent=up?"Create Account":"Login"}}
async function forgot(){const em=$("#em").value.trim();if(!em){$("#aerr").textContent="Age email likhun.";return}
 try{await FB.sendPasswordResetEmail(FB.auth,em);toast("Reset email pathano hoyeche")}catch(x){$("#aerr").textContent=authErr(x.code)}}
async function sendMsg(e){e.preventDefault();const f=e.target;if($("#c_hp").value){toast("Sent ✔");return}
 const d={name:$("#c_name").value.trim(),email:$("#c_email").value.trim(),phone:$("#c_phone").value.trim(),subject:$("#c_sub").value.trim(),message:$("#c_msg").value.trim(),ts:Date.now()};
 const b=$("#c_btn");b.disabled=true;
 try{const tg=fetch("/api/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}).then(r=>r.ok).catch(()=>false);
  let saved=true,err=null;
  try{if(FB)await FB.addDoc(FB.collection(FB.db,"messages"),d);else{const a=[{...d,id:"m"+d.ts},...ls("ch_msgs",[])];lset("ch_msgs",a);S.msgs=a}}catch(x){saved=false;err=x}
  const sent=await tg;if(!saved&&!sent)throw err;
  toast("Message pathano hoyeche ✔");f.reset()}catch(x){toast("Send hoyni: "+((x&&(x.code||x.message))||"error"))}
 b.disabled=false}
async function delMsg(id){if(!confirm("Message delete করবেন?"))return;try{if(FB)await FB.deleteDoc(FB.doc(FB.db,"messages",id));else{S.msgs=ls("ch_msgs",[]).filter(m=>m.id!=id);lset("ch_msgs",S.msgs);route()}}catch(x){toast("Delete hoyni")}}
function msgPanel(){const l=[...S.msgs].sort((a,b)=>b.ts-a.ts);
 return `<div class="panel" style="margin-bottom:50px"><h3>📨 Contact Messages (${l.length})</h3>${l.map(m=>`<div class="li" style="align-items:flex-start"><div style="flex:1"><b style="white-space:normal">${esc(m.subject)}</b><small>${esc(m.name)} · ${esc(m.email)}${m.phone?" · "+esc(m.phone):""} · ${fmt(m.ts)}</small><p class="body" style="margin:6px 0 0">${esc(m.message)}</p></div><a class="btn ghost sm" href="mailto:${esc(m.email)}?subject=Re: ${encodeURIComponent(m.subject)}">Reply</a><button class="btn danger sm" onclick="delMsg('${m.id}')">Delete</button></div>`).join("")||"<small>কোনো message নেই</small>"}</div>`}
const _pAdmin=pAdmin;
pAdmin=function(){if(!S.uid&&!S.local)return `<div class="panel" style="margin-top:40px;text-align:center"><h2>🔒 Admin Login</h2><p>Admin panel dekhte age login korun.</p><a class="btn" href="#/login">Login</a></div>`;
 const a=_pAdmin();return isAdmin()?a+msgPanel():a};
const _route=route;
route=function(){recalc();_route();const b=$("#loginBtn");if(b)b.textContent=S.uid?"Logout":"🔐 Login"};
window.initBackend=f=>{FB=f;let uCfg=null,uMsg=null;
 FB.onSnapshot(FB.collection(FB.db,"posts"),sn=>{S.posts=sn.docs.map(d=>({id:d.id,...d.data()}));route()},e=>toast("Posts load hoyni: "+e.code));
 FB.onAuthStateChanged(FB.auth,u=>{S.uid=u?u.uid:null;S.email=u?u.email:null;
  uCfg&&uCfg();uMsg&&uMsg();uCfg=uMsg=null;S.admins=[];S.msgs=[];
  if(u){uCfg=FB.onSnapshot(FB.doc(FB.db,"config","admins"),d=>{S.admins=(d.exists()&&d.data().ids)||[];route()},()=>{});
   uMsg=FB.onSnapshot(FB.collection(FB.db,"messages"),sn=>{S.msgs=sn.docs.map(d=>({id:d.id,...d.data()}));route()},()=>{})}
  route()})};
window.backendFailed=()=>{S.local=true;S.posts=ls("ch_posts",[]);S.admins=ls("ch_admins",[]);S.msgs=ls("ch_msgs",[]);route()};
route();
</script>
