<title>Mirpur College Updates &amp; Notices</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e4e8f1;--pri:#2850e8;--pri2:#7c5cff;--acc:#f59e0b;--sh:0 16px 36px -16px rgba(30,50,120,.28);--hh:62px;color-scheme:light}

.wrap{max-width:1100px;margin:auto;padding:0 18px}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:6px;height:var(--hh)}.sp{flex:1}
.logo{font-weight:800;font-size:17px;line-height:1.2;display:flex;gap:10px;align-items:center;margin-right:10px;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.logo img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}

button,.btn{font:inherit;cursor:pointer;border:0}

/* animated buttons */
.dl,.send{position:relative;overflow:hidden;isolation:isolate}
.dl::after,.send::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite;pointer-events:none;z-index:-1}

.dl .ic,.send .ic{display:inline-block}
.dl .ic{animation:dlb 1.7s ease-in-out infinite}

.dl:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 12px 24px -10px color-mix(in srgb,var(--pri) 65%,transparent)}
.dl:hover .ic{animation-duration:.6s}
.dl::before{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:currentColor;opacity:.8;z-index:-1}
.dl.go::before{animation:dlbar .9s ease-out forwards}
.dl.go .ic{animation:dlgo .9s ease-in-out}
@keyframes dlbar{to{width:100%}}

const otpEls=()=>[...document.querySelectorAll(".oi")];
const otpCode=()=>otpEls().map(e=>e.value).join("");
function otpSync(){const ins=otpEls();ins.forEach(e=>{e.classList.toggle("f",!!e.value);e.classList.remove("err")});const b=$("#v_btn");if(b)b.disabled=V.state!="idle"||otpCode().length<6}
function otpFill(d,start){const ins=otpEls();d=d.replace(/\D/g,"").slice(0,6-start);[...d].forEach((c,k)=>{ins[start+k].value=c});
 const n=Math.min(5,start+d.length);(ins[n]||ins[5]).focus();otpSync()}
function otpClear(err){const ins=otpEls();ins.forEach(e=>{e.value="";e.classList.remove("f");e.classList.toggle("err",!!err)});otpSync();if(ins[0])ins[0].focus()}
function wireOtp(){const ins=otpEls();
 ins.forEach((el,i)=>{
  el.addEventListener("input",()=>{const d=el.value.replace(/\D/g,"");if(d.length>2){otpFill(d,i&&d.length<6?i:0);return}el.value=d.slice(-1);if(el.value&&i<5)ins[i+1].focus();otpSync()});
  el.addEventListener("keydown",e=>{if(e.key=="Backspace"&&!el.value&&i>0){ins[i-1].value="";ins[i-1].focus();otpSync();e.preventDefault()}
   else if(e.key=="ArrowLeft"&&i>0){ins[i-1].focus();e.preventDefault()}else if(e.key=="ArrowRight"&&i<5){ins[i+1].focus();e.preventDefault()}
   else if(e.key=="Enter"){e.preventDefault();vSubmit()}});
  el.addEventListener("focus",()=>el.select());
  el.addEventListener("paste",e=>{e.preventDefault();const t=((e.clipboardData||window.clipboardData).getData("text")||"").replace(/\D/g,"").slice(0,6);if(t)otpFill(t,0)})})}
const SPN='<div class="vspin"><i></i><i></i></div>';
const SOK='<svg class="vsvg ok" viewBox="0 0 52 52" aria-hidden="true"><circle class="c" cx="26" cy="26" r="23"/><path class="t" d="M15 27l8 8 14-16"/></svg>';
const SBAD='<svg class="vsvg bad" viewBox="0 0 52 52" aria-hidden="true"><circle class="c" cx="26" cy="26" r="23"/><path class="t" d="M18 18l16 16M34 18L18 34"/></svg>';
function vState(s,msg){V.state=s;const st=$("#vStage"),r=$("#vRes");if(!st||!r)return;st.dataset.s=s;
 r.innerHTML=s=="loading"?SPN+`<p>${esc(msg||"যাচাই করা হচ্ছে…")}</p>`:s=="ok"?SOK+`<p class="g">${esc(msg||"সফলভাবে যাচাই হয়েছে!")}</p>`:s=="bad"?SBAD+`<p class="r">${esc(msg||"Code ঠিক নয় (Incorrect)")}</p>`:"";
 const b=$("#v_btn");if(b)b.disabled=s!="idle"||otpCode().length<6;vTick()}
const vErrShow=m=>{const e=$("#vErr");if(e){e.textContent=m||"";e.style.display=m?"block":"none"}};
const vInfo=t=>{const e=$("#vInfo");if(e)e.textContent=t||""};
function vTick(){const t=$("#vTimer");if(!t){clearInterval(V.iv);return}
 const left=Math.max(0,Math.ceil((V.resendAt-Date.now())/1000)),rb=$("#v_resend");
 t.textContent=left>0?"("+fmtT(left)+")":"";rb.disabled=left>0||V.sending||V.state!="idle";
 const x=$("#vExp");if(x){const el=Math.ceil((V.expAt-Date.now())/1000);x.classList.toggle("u",V.expAt>0&&el<=60);x.textContent=!V.expAt?"":el>0?"Code-এর মেয়াদ: "+fmtT(el):"Code-এর মেয়াদ শেষ — Resend করুন"}}
async function vSend(resend){if(V.sending)return;V.sending=true;vErrShow("");vInfo("Code পাঠানো হচ্ছে…");vTick();
 let r;try{r=await api("/api/send-code",{resend:!!resend})}catch(e){r={error:"net"}}
 V.sending=false;if(!$("#vStage"))return;
 if(r.ok&&r.verified){try{await U.user.reload();await U.user.getIdToken(true)}catch(e){}const p=U.pend||{};clearPend();clearInterval(V.iv);await finishAuth(U.user,p,!!p.year);return}
 if(r.ok){V.resendAt=Date.now()+(r.wait||0)*1000;V.expAt=Date.now()+(r.expires||600)*1000;
  vInfo(resend?"নতুন code পাঠানো হয়েছে ✓":r.reused?"আগে পাঠানো code এখনো কার্যকর — email দেখুন":"Code পাঠানো হয়েছে ✓");if(resend)toast("নতুন code পাঠানো হয়েছে")}
 else{vInfo("");
  if(r.error=="wait"||r.error=="limit"){V.resendAt=Date.now()+(r.wait||60)*1000;vErrShow(r.error=="limit"?"অনেকবার code চাওয়া হয়েছে — "+fmtT(r.wait)+" পর আবার চেষ্টা করুন":"একটু অপেক্ষা করুন, তারপর Resend করুন")}
  else{V.resendAt=0;vErrShow(r.error=="net"?"Internet connection check করুন":r.error=="quota"?"আজকের email limit শেষ — কিছুক্ষণ পর চেষ্টা করুন":"Code পাঠানো যায়নি — Resend চাপুন")}}
 vTick()}
function vResend(){if(V.state!="idle"||V.sending)return;otpClear();vSend(true)}
async function vSubmit(){if(V.state!="idle")return;const code=otpCode();if(code.length<6)return;
 vErrShow("");vState("loading");let r;
 try{[r]=await Promise.all([api("/api/verify-code",{code}),wait(1100)])}catch(e){r={error:"net"}}
 if(!$("#vStage"))return;
 if(r.ok){try{await U.user.reload();await U.user.getIdToken(true)}catch(e){}
  vState("ok");await wait(1500);const p=U.pend||{};clearPend();clearInterval(V.iv);U.busy=true;
  try{await finishAuth(U.user,p,!!p.year)}finally{U.busy=false}return}
 const M={wrong:"Code ঠিক নয় (Incorrect)"+(r.left>0?" — আর "+r.left+" বার চেষ্টা করতে পারবেন":""),expired:"Code-এর মেয়াদ শেষ হয়েছে",locked:"অনেকবার ভুল দিয়েছেন",net:"Internet connection check করুন"};
 vState("bad",M[r.error]||"কিছু সমস্যা হয়েছে, আবার চেষ্টা করুন");await wait(1800);
 if(!$("#vStage"))return;vState("idle");otpClear(r.error=="wrong");
 if(r.error=="expired"||r.error=="locked"){V.resendAt=Math.min(V.resendAt,Date.now());vErrShow((r.error=="expired"?"Code-এর মেয়াদ শেষ":"অনেকবার ভুল code দেওয়া হয়েছে")+" — নতুন code নিতে Resend চাপুন");vTick()}}
async function cancelVerify(){clearPend();clearInterval(V.iv);let del=false;
 try{const{A}=await getSDK(),u=U.user;if(isFresh(u)&&needsVerify(u)){try{await A.deleteUser(u);del=true}catch(e){}}}catch(e){}
 await logout();if(del)showGate("signup")}

  <form id="pfForm" onsubmit="saveProfile(event)" oninput="pfDirty()">

function resizeImg(file,size){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{try{const s=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,size,size);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.82))}catch(e){rej(e)}};
 im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"))};im.src=url})}
async function pickPhoto(inp){const file=inp.files&&inp.files[0];if(!file)return;if(!/^image\//.test(file.type)){toast("Shudhu image file den");return}
 const d=pDraft();try{U.prof.photo=await resizeImg(file,256)}catch(e){toast("Photo load hoyni, onno ekta den");return}
 writeCache();paintMe();openProfile(d);if(await saveProf())toast("Photo save hoyeche")}
async function rmPhoto(){const d=pDraft();U.prof.photo="";writeCache();paintMe();openProfile(d);if(await saveProf())toast("Photo remove hoyeche")}
async function saveProfile(e){e.preventDefault();const d=pDraft(),b=$("#p_btn");b.disabled=true;
 U.prof={...U.prof,name:d.name.trim().slice(0,80)||U.prof.name,year:d.year,dept:d.dept};writeCache();paintMe();
 const ok=await saveProf();S.pfd=null;route();if(ok){sheetSync();toast("Profile update hoyeche")}}

/* ---- App update notice ---- */
function showUpd(reg){if($("#updBar"))return;try{if(sessionStorage.getItem("mcn_upd_later"))return}catch(e){}
 const d=document.createElement("div");d.id="updBar";d.setAttribute("role","alert");
 d.innerHTML=`<div class="ub-i">${SVG("zap")}</div><div class="ub-t"><b>নতুন Update এসেছে!</b><span>নতুন feature ও fix পেতে app update করুন।</span></div><div class="ub-b"><button class="btn sm" id="updGo">Update</button><button class="ub-x" id="updLater" type="button">পরে</button></div>`;
 document.body.appendChild(d);
 $("#updGo").onclick=()=>{const g=$("#updGo");g.disabled=true;g.textContent="হচ্ছে…";window.__upd=true;
  if(reg&&reg.waiting)reg.waiting.postMessage({type:"SKIP_WAITING"});else location.reload();
  setTimeout(()=>location.reload(),4000)};
 $("#updLater").onclick=()=>{try{sessionStorage.setItem("mcn_upd_later","1")}catch(e){}d.remove()}}
if("serviceWorker"in navigator){let rl=false;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(rl||!window.__upd)return;rl=true;location.reload()});
 addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").then(reg=>{
  const ask=()=>{if(navigator.serviceWorker.controller&&reg.waiting)showUpd(reg)};
  ask();
  reg.addEventListener("updatefound",()=>{const w=reg.installing;if(w)w.addEventListener("statechange",()=>{if(w.state=="installed")ask()})});
  const chk=()=>{reg.update().catch(()=>{})};
  setInterval(chk,30*60*1000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()})}).catch(()=>{}))}
(function boot(){try{const c=JSON.parse(localStorage.getItem("mcn_posts")||"null");if(c&&c.posts){S.posts=c.posts;S.t=c.t;S.loaded=true}}catch(e){}
 document.addEventListener("visibilitychange",()=>{if(U.prof&&!document.hidden&&Date.now()-(S.t||0)>300000)refresh(true)});
 const c=readCache();
 if(c&&c.uid&&YEARS.includes(c.year)&&DEPTS.includes(c.dept)){U.prof=c;enter(false)}else showGate("login");
 authInit()})();
