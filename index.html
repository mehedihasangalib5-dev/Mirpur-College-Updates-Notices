<title>Mirpur College Updates &amp; Notices</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e4e8f1;--pri:#2850e8;--pri2:#7c5cff;--acc:#f59e0b;--sh:0 16px 36px -16px rgba(30,50,120,.28);--hh:62px;color-scheme:light}

.wrap{max-width:1100px;margin:auto;padding:0 18px}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:6px;height:var(--hh)}.sp{flex:1}
.logo{font-weight:800;font-size:17px;line-height:1.2;display:flex;gap:10px;align-items:center;margin-right:10px;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.logo img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}

button,.btn{font:inherit;cursor:pointer;border:0}

/* animated buttons */
.dl,.send{position:relative;overflow:hidden;isolation:isolate}
.dl::after,.send::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite;pointer-events:none;z-index:-1}

.dl .ic,.send .ic{display:inline-block}
.dl .ic{animation:dlb 1.7s ease-in-out infinite}

.dl:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 12px 24px -10px color-mix(in srgb,var(--pri) 65%,transparent)}
.dl:hover .ic{animation-duration:.6s}
.dl::before{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:currentColor;opacity:.8;z-index:-1}
.dl.go::before{animation:dlbar .9s ease-out forwards}
.dl.go .ic{animation:dlgo .9s ease-in-out}
@keyframes dlbar{to{width:100%}}

const PKEY="mcn_push",PASK="mcn_push_ask",PPREF="mcn_push_pref",PTS="mcn_push_t";
const pushOK=()=>"Notification" in window&&"serviceWorker" in navigator&&"PushManager" in window;
const pGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const pSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
async function pApi(data){const u=U.user;if(!u)throw new Error("login");const tk=await u.getIdToken();
 const r=await fetch("/api/subscribe",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tk},body:JSON.stringify(data)});
 let j={};try{j=await r.json()}catch(e){}return{...j,status:r.status}}
// ask=true hole permission chay (button tap-er por). Return: on | default | denied | unsupported | nokey | error
async function pushOn(ask){
 if(!pushOK()||!U.user)return"unsupported";
 let perm=Notification.permission;if(perm=="denied")return"denied";
 if(perm=="default"){if(!ask)return"default";perm=await Notification.requestPermission();if(perm!="granted")return perm=="denied"?"denied":"default"}
 try{const cfg=await fetch("/api/subscribe").then(r=>r.json()).catch(()=>({}));
  const{app}=await getSDK();const M=await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js");
  if(!(await M.isSupported()))return"unsupported";
  const reg=await navigator.serviceWorker.ready;
  const token=await M.getToken(M.getMessaging(app),cfg.vapid?{vapidKey:cfg.vapid,serviceWorkerRegistration:reg}:{serviceWorkerRegistration:reg});   // VAPID key na thakle Firebase-er default key
  if(!token)return"error";
  const r=await pApi({token,action:"sub"});if(!r.ok)return"error";
  pSet(PKEY,token);pSet(PTS,String(Date.now()));pSet(PPREF,"on");try{paintBell()}catch(e){}return"on"}catch(e){return"error"}}
async function pushOff(){const t=pGet(PKEY);pSet(PKEY,null);pSet(PTS,null);try{paintBell()}catch(e){}if(!t||!U.user)return;try{await pApi({token:t,action:"unsub"})}catch(e){}}
function pushAuto(){if(!pushOK()||!U.user||pGet(PPREF)=="off")return;
 const p=Notification.permission;
 if(p=="granted"){if(pGet(PKEY)&&Date.now()-(+pGet(PTS)||0)<432e5)return;pushOn(false);return}   // age allow dewa thakle chupchap subscribe
 if(p=="default"&&Date.now()-(+pGet(PASK)||0)>3*864e5)setTimeout(pushPrompt,2500)}              // na hole ekbar bhodro prompt
function pushPrompt(){if($("#pbar")||!U.prof||Notification.permission!="default")return;
 const d=document.createElement("div");d.id="pbar";d.className="pbar";
 d.innerHTML=`<span class="pbar-i">${SVG("bell")}</span><div><b>Notice-er alert chalu korun</b><small>Notun Notice, Routine ba Result ashle phone-e sathe sathe jante parben.</small></div><div class="pbar-a"><button class="btn ghost sm" id="pb_no" type="button">Pore</button><button class="btn sm" id="pb_on" type="button">Chalu korun</button></div>`;
 document.body.appendChild(d);
 $("#pb_on").onclick=async()=>{d.remove();pushToast(await pushOn(true))};
 $("#pb_no").onclick=()=>{pSet(PASK,String(Date.now()));d.remove()}}
function pushToast(r){toast(r=="on"?"Notification chalu hoyeche ✓":r=="denied"?"Browser-e notification block kora — Site settings theke Allow korun":r=="nokey"?"Notification setup shesh hoyni — Admin-ke janan":r=="unsupported"?"Ei browser-e notification hoy na (iPhone-e Share → Add to Home Screen korun)":r=="default"?"Notification allow kora hoyni":"Notification chalu hoyni, abar chesta korun")}
function pIsOn(){return pushOK()&&Notification.permission=="granted"&&pGet(PPREF)!="off"&&!!pGet(PKEY)}
