const CATS={notice:{n:"Notice",i:"📢",c:"#e5484d"},syllabus:{n:"Syllabus",i:"📚",c:"#5b4bff"},suggestion:{n:"Suggestion",i:"💡",c:"#e08a00"},routine:{n:"Routine",i:"🗓",c:"#0d9488"},result:{n:"Result",i:"🏆",c:"#16a34a"},event:{n:"Event",i:"🎉",c:"#d6409f"}};
const YEARS=["HSC 1st Year","HSC 2nd Year"],DEPTS=["Science","Arts","Commerce"]; // admin.html-er sathe mil rakhte hobe
const PAGES=YEARS.flatMap(y=>DEPTS.map(d=>y+" · "+d)); // protita Year x Department = ekta alada page
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=t=>new Date(t).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const DAY=864e5,isNew=p=>Date.now()-p.ts<3*DAY,isExp=p=>!!p.dl&&Date.now()>p.dl;
const sorted=l=>[...l].sort((a,b)=>(isExp(a)?1:0)-(isExp(b)?1:0)||(b.pinned?1:0)-(a.pinned?1:0)||b.ts-a.ts);
const dDate=t=>new Date(t).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const dlBadge=p=>{if(!p.dl)return"";if(isExp(p))return'<span class="dlb exp">⏰ শেষ হয়ে গেছে</span>';const n=Math.ceil((p.dl-Date.now())/DAY);return n<=1?'<span class="dlb hot">🔥 আজই শেষ!</span>':n<=3?`<span class="dlb warn">⏳ ${n} দিন বাকি</span>`:`<span class="dlb ok">📅 ${n} দিন বাকি</span>`};
const dlLine=p=>p.dl?`<p class="dl">${dlBadge(p)}<span>শেষ তারিখ: ${dDate(p.dl)}</span></p>`:"";
const tagsHTML=p=>{const c=CATS[p.cat]||CATS.notice,e=isExp(p);return `<div class="tags"><span class="tag cat" style="--c:${c.c}">${c.i} ${c.n}${p.pinned?" · 📌":""}</span>${isNew(p)&&!e?'<span class="tag new">🆕 New</span>':""}</div>`};
const ok=u=>/^(https?:|data:image\/)/.test(u||"");
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}
function closeM(){$("#modal").classList.remove("open")}
$("#modal").addEventListener("click",e=>{if(e.target.id=="modal")closeM()});
$("#theme").onclick=()=>{const d=document.documentElement,t=(d.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))=="dark"?"light":"dark";d.dataset.theme=t;try{localStorage.setItem("mcn_theme",t)}catch(e){}};

const S={posts:[],cat:null,q:"",loaded:false};let CUR=null;
const PROJ="muc-network-50a06",KEY="AIzaSyAgZV0TeVSXYYnQiKqGKq7N2hAWk4FU4fo",BASE="https://firestore.googleapis.com/v1/projects/"+PROJ+"/databases/(default)/documents";
const firebaseConfig={apiKey:KEY,authDomain:PROJ+".firebaseapp.com",projectId:PROJ,messagingSenderId:"143299318658",appId:"1:143299318658:web:5bb77c759dbd075f51359b"};
const fv=v=>"stringValue"in v?v.stringValue:"integerValue"in v?+v.integerValue:"doubleValue"in v?v.doubleValue:"booleanValue"in v?v.booleanValue:"arrayValue"in v?(v.arrayValue.values||[]).map(fv):"mapValue"in v?fo(v.mapValue.fields||{}):null;
const fo=f=>Object.fromEntries(Object.entries(f).map(([k,v])=>[k,fv(v)]));
const toDoc=d=>({id:d.name.split("/").pop(),...fo(d.fields||{})});
const LITE=["title","body","cat","pinned","ts","nf","hc","link","grp","dl"];
const COVER={},FULL={};
const rurl=(p,mask)=>{const u=new URL(BASE+p);u.searchParams.set("key",KEY);(mask||[]).forEach(m=>u.searchParams.append("mask.fieldPaths",m));return u};
async function loadPosts(){const out=[];let tok="";
 for(let i=0;i<5;i++){const u=rurl("/posts",LITE);u.searchParams.set("pageSize","100");if(tok)u.searchParams.set("pageToken",tok);
  const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();(j.documents||[]).forEach(d=>out.push(toDoc(d)));tok=j.nextPageToken||"";if(!tok)break}
 return out}
async function getFull(id){if(FULL[id])return FULL[id];const r=await fetch(rurl("/posts/"+id));if(!r.ok)throw new Error(r.status);return FULL[id]=toDoc(await r.json())}
async function getCover(id){if(id in COVER)return COVER[id];const r=await fetch(rurl("/posts/"+id,["cover"]));if(!r.ok)throw new Error(r.status);return COVER[id]=toDoc(await r.json()).cover||null}
let SDKp=null;
function getSDK(){return SDKp||(SDKp=(async()=>{const V="https://www.gstatic.com/firebasejs/12.19.0/";const [a,f,A]=await Promise.all([import(V+"firebase-app.js"),import(V+"firebase-firestore.js"),import(V+"firebase-auth.js")]);const app=a.getApps().length?a.getApp():a.initializeApp(firebaseConfig);return{app,db:f.getFirestore(app),f,A,auth:A.getAuth(app)}})().catch(e=>{SDKp=null;throw e}))}
async function sdkMode(){try{const {db,f}=await getSDK();S.sdk=true;S.fresh=true;f.onSnapshot(f.collection(db,"posts"),sn=>{S.posts=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded=true;route()},()=>{S.loaded=true;route()})}catch(e){S.loaded=true;route()}}
async function refresh(force){if(!force&&Date.now()-(S.t||0)<30000){S.fresh=true;route();return}
 try{S.posts=await loadPosts();S.t=Date.now();S.sdk=false;S.loaded=true;S.fresh=true;try{localStorage.setItem("mcn_posts",JSON.stringify({t:S.t,posts:S.posts}))}catch(e){}route()}
 catch(e){if(S.posts.length){S.loaded=true;route()}else sdkMode()}}
const io="IntersectionObserver"in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);fillCover(e.target)}}),{rootMargin:"300px"}):null;
async function fillCover(el){const id=el.dataset.cv;try{const c=await getCover(id);if(c&&ok(c.url)){el.innerHTML=`<img src="${esc(c.url)}" alt="">`;el.classList.add("done")}else el.remove()}catch(e){el.remove()}}
function observeCovers(){document.querySelectorAll("[data-cv]").forEach(el=>io?io.observe(el):fillCover(el))}
async function saveMsg(d){
 const fields={name:{stringValue:d.name},email:{stringValue:d.email},phone:{stringValue:d.phone},subject:{stringValue:d.subject},message:{stringValue:d.message},ts:{integerValue:String(d.ts)}};
 try{const r=await fetch(rurl("/messages"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});if(!r.ok)throw new Error("HTTP "+r.status)}
 catch(e){const {db,f}=await getSDK();await f.addDoc(f.collection(db,"messages"),d)}}
const atts=p=>[...(p.files||[]),...(/^https?:\/\//.test(p.link||"")?[{name:"Link",type:"link",url:p.link}]:[])].filter(f=>ok(f.url));
function driveDl(u){const m=u.match(/drive\.google\.com\/file\/d\/([^/?#]+)/)||(u.includes("drive.google.com")&&u.match(/[?&]id=([^&#]+)/));return m?"https://drive.google.com/uc?export=download&id="+m[1]:null}
function attHTML(f){const u=esc(f.url);
 if(/^image\//.test(f.type))return `<div class="att"><img class="big" src="${u}" alt=""><a class="btn ghost sm" href="${u}" download="${esc(f.name||"image")}.jpg">⬇ Download</a></div>`;
 const d=driveDl(f.url);
 return `<div class="file"><span>📎 ${esc(f.name)}</span><span class="sp"></span><a class="btn ghost sm" href="${u}" target="_blank" rel="noopener">Open</a>${d?`<a class="btn sm" href="${esc(d)}" target="_blank" rel="noopener">⬇ Download</a>`:""}</div>`}
const cnt=p=>p.nf!=null?p.nf:atts(p).length;
function card(p){const n=cnt(p),c=CATS[p.cat]||CATS.notice;
 const cv=p.cover&&ok(p.cover.url)?`<img src="${esc(p.cover.url)}" alt="">`:(!p.cover&&!S.sdk&&p.hc!==false?`<div class="cvr" data-cv="${p.id}"></div>`:"");
 return `<article class="card ${isExp(p)?"expd":""}" style="--c:${c.c}" onclick="openPost('${p.id}')">${cv}<div class="cb"><div class="ctop">${tagsHTML(p)}${dlBadge(p)}</div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><div class="meta"><span>🕒 ${dDate(p.ts)}</span><span>${n?"📎 "+n+" attachment":""}</span></div></div></article>`}
function fcard(p){const c=CATS[p.cat]||CATS.notice;
 return `<article class="fcard" style="--c:${c.c}" onclick="openPost('${p.id}')"><div class="ft"><span>${c.i} ${c.n}${p.pinned?" · 📌 Pinned":""}</span>${dlBadge(p)}</div><h3>${esc(p.title)}</h3><div class="fgo">পড়ুন →</div></article>`}
const match=p=>!S.q||(p.title+" "+p.body).toLowerCase().includes(S.q.toLowerCase());
const SK=Array(6).fill('<div class="card sk"><div class="cb"><span class="tag">&nbsp;</span><h3>&nbsp;</h3><p>&nbsp;</p></div></div>').join("");
function pHome(){const base=S.posts.filter(p=>match(p)&&vis(p)),c=CATS[S.cat];
 const fs=(!S.cat&&!S.q&&S.loaded)?sorted(base.filter(p=>!isExp(p)&&(p.pinned||(p.dl&&p.dl-Date.now()<=3*DAY)))).slice(0,6):[],fid=new Set(fs.map(p=>p.id));
 const l=sorted(base.filter(p=>(!S.cat||p.cat==S.cat)&&!fid.has(p.id))),cc=k=>base.filter(p=>p.cat==k).length;
 return `<section class="hero"><img class="hero-logo" src="logo.png" alt=""><h1>সব <span>Notice, Syllabus</span><br>ও Suggestion এক জায়গায়</h1>${whoHTML()}<p>Mirpur College Updates &amp; Notices-এর সর্বশেষ আপডেট, category অনুযায়ী সাজানো।</p>
 <div class="sbar"><div class="search"><span>🔍</span><input id="q" placeholder="Notice, routine, result খুঁজুন…" value="${esc(S.q)}"><button class="btn sm" onclick="S.q=$('#q').value.trim();route()">Search</button></div><div class="filter"><select id="catSel" aria-label="Category" onchange="setCat(this.value)"><option value="" ${S.cat?"":"selected"}>🗂 সব Category (${base.length})</option>${Object.entries(CATS).map(([k,x])=>`<option value="${k}" ${S.cat==k?"selected":""}>${x.i} ${x.n} (${cc(k)})</option>`).join("")}</select></div></div></section>
 ${fs.length?`<h2 class="t"><span>📌 গুরুত্বপূর্ণ</span><small>Pinned ও deadline কাছে</small></h2><div class="fs">${fs.map(fcard).join("")}</div>`:""}
 <h2 class="t" id="list"><span>${c?c.i+" "+c.n:"🆕 সর্বশেষ Post"}</span><small>${l.length} টি</small></h2>
 <div class="grid">${!S.loaded?SK:l.length?l.map(card).join(""):'<div class="empty"><b>🗂</b>এই category-তে এখনো কোনো post নেই।</div>'}</div>`}
function setCat(k){S.cat=k||null;route();const el=$("#list");el&&el.scrollIntoView({behavior:"smooth"})}
function pContact(){return `<section class="hero" style="padding-bottom:10px"><h1>📬 <span>Contact</span> করুন</h1><p>প্রশ্ন, পরামর্শ বা অভিযোগ থাকলে নিচের form-এ জানান।</p></section>
 <div class="panel" style="max-width:660px;margin:0 auto 50px"><form onsubmit="sendMsg(event)">
 <div class="two"><div><label>Name *</label><input id="c_name" required maxlength="80"></div><div><label>Email *</label><input id="c_email" type="email" required maxlength="120"></div></div>
 <div class="two"><div><label>Phone</label><input id="c_phone" maxlength="30"></div><div><label>Subject *</label><input id="c_sub" required maxlength="150"></div></div>
 <label>Message *</label><textarea id="c_msg" required minlength="5" maxlength="2000"></textarea>
 <input id="c_hp" style="display:none" tabindex="-1" autocomplete="off">
 <div class="row"><button class="btn" id="c_btn">Send Message ✈</button></div></form></div>`}
async function sendMsg(e){e.preventDefault();const f=e.target;if($("#c_hp").value){toast("Sent ✔");return}
 const d={name:$("#c_name").value.trim(),email:$("#c_email").value.trim(),phone:$("#c_phone").value.trim(),subject:$("#c_sub").value.trim(),message:$("#c_msg").value.trim(),ts:Date.now()};
 const b=$("#c_btn");b.disabled=true;
 try{const tg=fetch("/api/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}).then(r=>r.ok).catch(()=>false);
  let saved=true,err=null;try{await saveMsg(d)}catch(x){saved=false;err=x}
  const sent=await tg;if(!saved&&!sent)throw err||new Error("error");
  toast("Message pathano hoyeche ✔");f.reset()}catch(x){toast("Send hoyni: "+((x&&(x.code||x.message))||"error"))}
 b.disabled=false}
const FAIL={},TRY={};
function shareBar(f){const u=location.origin+"/p/"+f.id,e=encodeURIComponent;
 return `<div class="share"><span>📤 Share:</span><a class="btn sm" target="_blank" rel="noopener" href="https://api.whatsapp.com/send?text=${e("📢 *"+f.title+"*\n"+u)}">📲 WhatsApp</a><a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${e(u)}">Facebook</a><button class="btn ghost sm" onclick="copyLink('${f.id}')">🔗 Copy link</button>${navigator.share?`<button class="btn ghost sm" onclick="nativeShare('${f.id}')">More…</button>`:""}</div>`}
function copyLink(id){const u=location.origin+"/p/"+id;if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast("Link copied ✔"),()=>prompt("Link:",u));else prompt("Link:",u)}
function nativeShare(id){const p=FULL[id]||S.posts.find(x=>x.id==id);navigator.share({title:p?p.title:"Notice",url:location.origin+"/p/"+id}).catch(()=>{})}
function openPost(id){location.hash="#/p/"+id}
function pPost(id){const p=FULL[id]||S.posts.find(x=>x.id==id);
 const back='<a class="lnk" style="text-decoration:none;display:inline-block;margin-bottom:12px" href="#/">← সব Post</a>';
 if(p&&!vis(p))return `<div class="panel post-page">${back}<h3>🔒 এই post টি আপনার Year / Department-এর জন্য নয়</h3></div>`;
  if(!p)return `<div class="panel post-page">${back}${S.fresh&&TRY[id]==2?"<h3>Post ta pawa jayni 😕</h3>":'<div class="card sk" style="border:0"><div class="cb"><span class="tag">&nbsp;</span><h3>&nbsp;</h3><p>&nbsp;</p><p>&nbsp;</p></div></div>'}</div>`;
 const lite=!FULL[id]&&!S.sdk,pend=lite&&!FAIL[id]&&(p.nf==null||p.nf>0||p.hc!==false);
 const c=CATS[p.cat]||CATS.notice,a=atts(p);
 return `<div class="panel post-page">${back}${tagsHTML(p)}<h2 style="margin:8px 0">${esc(p.title)}</h2><small>${fmt(p.ts)}</small>${dlLine(p)}${p.cover&&ok(p.cover.url)?`<img class="big" src="${esc(p.cover.url)}" alt="">`:""}<p class="body">${esc(p.body)}</p>${pend?'<p><small>⏳ Attachment লোড হচ্ছে…</small></p>':lite&&FAIL[id]?'<p><small>⚠ Attachment load hoyni, page refresh korun.</small></p>':""}${a.length?`<h4 style="margin:18px 0 6px">📎 Attachments</h4>`+a.map(attHTML).join(""):""}${shareBar(p)}</div>`}
async function loadPost(id){const p=S.posts.find(x=>x.id==id);
 if(!p&&!FULL[id]&&!TRY[id]){TRY[id]=1;try{await getFull(id)}catch(e){}TRY[id]=2;if(location.hash.includes(id))route();return}
 if(!p||S.sdk||FULL[id]||FAIL[id])return;if(!(p.nf==null||p.nf>0||p.hc!==false))return;
 try{await getFull(id)}catch(e){FAIL[id]=1}if(location.hash.includes(id))route()}
function route(){const h=location.hash.replace(/^#\/?/,"").split("/"),pg=h[0]||"home";
 $("#links").innerHTML=`<a href="#/" class="${pg=="home"?"on":""}">Home</a><a href="#/contact" class="${pg=="contact"?"on":""}">Contact</a>`;
 $("#yr").textContent=new Date().getFullYear();{const f=$("#fab"),c=pg=="contact";f.href=c?"#/":"#/contact";f.innerHTML=c?"<span>🏠</span>Home":"<span>💬</span>Contact";f.setAttribute("aria-label",c?"Home":"Contact")}const k=document.activeElement&&document.activeElement.id;
 $("#app").innerHTML=pg=="contact"?pContact():pg=="p"?pPost(h[1]):pHome();observeCovers();if(pg=="p")loadPost(h[1]);
 const q=$("#q");if(q){q.addEventListener("keydown",e=>{if(e.key=="Enter"){S.q=q.value.trim();route()}});if(k=="q")q.focus()}}
addEventListener("hashchange",()=>{route();scrollTo(0,0)});
/* ---------- LOGIN / PROFILE ---------- */
const U={user:null,prof:null,busy:false,mode:"login",started:false};
const PK="mcn_user",root=document.documentElement;
const readCache=()=>{try{return JSON.parse(localStorage.getItem(PK)||"null")}catch(e){return null}};
const writeCache=()=>{try{U.prof?localStorage.setItem(PK,JSON.stringify(U.prof)):localStorage.removeItem(PK)}catch(e){}};
const gated=on=>root.classList.toggle("gated",on);
const initial=n=>(String(n||"?").trim()[0]||"?").toUpperCase();
const imgOk=u=>/^data:image\//.test(u||"");
const avInner=()=>{const p=U.prof||{};return imgOk(p.photo)?`<img src="${esc(p.photo)}" alt="">`:esc(initial(p.name))};
const whoHTML=()=>U.prof?`<span class="who"><b>📘 ${esc(U.prof.year)} · ${esc(U.prof.dept)}</b> &nbsp;·&nbsp; 👋 ${esc(U.prof.name)}</span>`:"";
const opts=(a,v)=>a.map(x=>`<option value="${esc(x)}" ${x==v?"selected":""}>${esc(x)}</option>`).join("");
// Protita post ek ba ekadhik "page"-e thake (grp). grp faka = shob page. Purono year/dept tag-o bujhe.
function pagesOf(p){const g=p.grp||[];if(!g.length)return PAGES;const out=new Set(g.filter(x=>PAGES.includes(x))),ly=g.filter(x=>YEARS.includes(x)),ld=g.filter(x=>DEPTS.includes(x));
 if(ly.length||ld.length)(ly.length?ly:YEARS).forEach(y=>(ld.length?ld:DEPTS).forEach(d=>out.add(y+" · "+d)));return out.size?[...out]:PAGES}
const myPage=()=>U.prof?U.prof.year+" · "+U.prof.dept:"";
const vis=p=>!!U.prof&&pagesOf(p).includes(myPage());
const AUTHERR={"auth/invalid-credential":"Email ba Password thik noy","auth/wrong-password":"Email ba Password thik noy","auth/user-not-found":"Email ba Password thik noy","auth/invalid-login-credentials":"Email ba Password thik noy","auth/email-already-in-use":"Ei email-e age-i account ache — Login tab-e jan","auth/weak-password":"Password kompokkhe 6 ta character hote hobe","auth/invalid-email":"Email ta thik noy","auth/network-request-failed":"Internet connection check korun","auth/too-many-requests":"Onek bar try hoyeche, kichukkhon pore abar chesta korun","auth/operation-not-allowed":"Firebase Console → Authentication → Sign-in method → Email/Password chalu korun"};
const authErr=e=>{const c=(e&&e.code)||"";return AUTHERR[c]||("Problem: "+(c||(e&&e.message)||e))};
function paintMe(){const b=$("#meBtn");if(!U.prof||root.classList.contains("gated")){b.style.display="none";return}b.style.display="flex";b.innerHTML=avInner();b.title=U.prof.name+" — Profile"}
const gv=id=>{const e=$("#"+id);return e?e.value:""};
const gVals=()=>({name:gv("g_name").trim(),year:gv("g_year"),dept:gv("g_dept"),email:gv("g_email").trim()});
function gErrShow(m){const e=$("#gErr");if(e){e.textContent=m||"";e.style.display=m?"block":"none"}}
function renderGate(v){v=v||{};const m=U.mode,cp=m=="complete",su=m=="signup",p=U.prof||{};
 const nm=v.name??p.name??"",yr=v.year??p.year??"",dp=v.dept??p.dept??"";
 $("#gate").innerHTML=`<div class="gbox"><img class="glogo" src="logo.png" alt=""><h1>${cp?"Profile সম্পূর্ণ করুন":"স্বাগতম 👋"}</h1><p class="gs">${cp?"আপনার Year ও Department select করুন":"Login করে আপনার Year ও Department-এর update দেখুন"}</p>
 ${cp?"":`<div class="gtabs"><button type="button" class="${su?"":"on"}" onclick="gMode('login')">Login</button><button type="button" class="${su?"on":""}" onclick="gMode('signup')">Sign up</button></div>`}
 <form id="gForm" onsubmit="gSubmit(event)">
 <label>Name${su||cp?" *":""}</label><input id="g_name" maxlength="80" ${su||cp?"required":""} autocomplete="name" placeholder="আপনার নাম" value="${esc(nm)}">
 <div class="two"><div><label>Year *</label><select id="g_year" required><option value="">Select</option>${opts(YEARS,yr)}</select></div><div><label>Department *</label><select id="g_dept" required><option value="">Select</option>${opts(DEPTS,dp)}</select></div></div>
 ${cp?"":`<label>Email *</label><input id="g_email" type="email" required maxlength="120" autocomplete="email" placeholder="you@example.com" value="${esc(v.email||"")}">
 <label>Password *</label><div class="pw"><input id="g_pw" type="password" required minlength="6" maxlength="64" autocomplete="${su?"new-password":"current-password"}"><button type="button" onclick="togglePw()" aria-label="Show password">👁</button></div>`}
 <div class="gerr" id="gErr"></div>
 <button class="btn" id="g_btn">${cp?"Continue →":su?"Account খুলুন →":"Login →"}</button></form>
 <div class="gfoot">${cp?'<button type="button" class="lnk" onclick="logout()">Log out</button>':su?"":'<button type="button" class="lnk" onclick="gForgot()">Password ভুলে গেছেন?</button>'}</div></div>`}
function showGate(mode){U.mode=mode||"login";renderGate();gated(true);paintMe();scrollTo(0,0)}
function gMode(m){const v=gVals();U.mode=m;renderGate(v)}
function togglePw(){const i=$("#g_pw");i.type=i.type=="password"?"text":"password"}
async function gForgot(){const em=gv("g_email").trim();if(!em){gErrShow("আগে Email লিখুন, তারপর এই link-এ tap করুন");return}
 try{const {auth,A}=await getSDK();await A.sendPasswordResetEmail(auth,em);gErrShow("");toast("Password reset email pathano hoyeche ✔")}catch(x){gErrShow(authErr(x))}}
async function fetchProfile(uid){try{const {db,f}=await getSDK();const sn=await f.getDoc(f.doc(db,"users",uid));return sn.exists()?sn.data():null}catch(e){return null}}
async function saveProf(){if(!U.user||!U.prof)return false;
 try{const {db,f}=await getSDK(),p=U.prof;await f.setDoc(f.doc(db,"users",U.user.uid),{uid:U.user.uid,name:p.name,email:p.email||"",year:p.year,dept:p.dept,photo:p.photo||"",updated:Date.now()});return true}
 catch(e){toast("Server-e save hoyni — Firestore rules update korun (ei device-e save ache)");return false}}
function enter(fresh){gated(false);paintMe();route();
 if(fresh){S.t=0;toast("স্বাগতম, "+U.prof.name+" ✔")}
 if(!S.started){S.started=true;refresh()}}
async function finishAuth(user,ch,isNew){
 const c=readCache();let base=isNew?(U.prof&&U.prof.uid==user.uid?U.prof:{}):((await fetchProfile(user.uid))||(c&&c.uid==user.uid?c:{}));
 U.user=user;
 U.prof={uid:user.uid,name:(ch.name||base.name||user.displayName||(user.email||"").split("@")[0]||"Student").slice(0,80),email:user.email||"",year:ch.year,dept:ch.dept,photo:base.photo||""};
 writeCache();await saveProf();enter(true)}
async function gSubmit(e){e.preventDefault();if(U.busy)return;
 const v=gVals(),pw=gv("g_pw"),m=U.mode,b=$("#g_btn"),t=b.textContent;U.busy=true;b.disabled=true;b.textContent="অপেক্ষা করুন…";gErrShow("");
 try{const {auth,A}=await getSDK();
  if(m=="complete"){await finishAuth(auth.currentUser,v,true)}
  else{let cr;
   if(m=="signup"){cr=await A.createUserWithEmailAndPassword(auth,v.email,pw);try{await A.updateProfile(cr.user,{displayName:v.name})}catch(_){}}
   else cr=await A.signInWithEmailAndPassword(auth,v.email,pw);
   await finishAuth(cr.user,v,m=="signup")}}
 catch(x){gErrShow(authErr(x));b.disabled=false;b.textContent=t}
 U.busy=false}
async function logout(){closeM();U.prof=null;U.user=null;writeCache();
 try{const {auth,A}=await getSDK();await A.signOut(auth)}catch(e){}
 location.hash="#/";showGate("login");toast("Log out hoyeche")}
async function authInit(){try{const {auth,A}=await getSDK();
 A.onAuthStateChanged(auth,async u=>{if(U.busy)return;
  if(!u){U.user=null;if(!root.classList.contains("gated")){U.prof=null;writeCache();showGate("login")}return}
  U.user=u;const c=readCache();let pr=await fetchProfile(u.uid);if(!pr&&c&&c.uid==u.uid)pr=c;
  if(pr&&YEARS.includes(pr.year)&&DEPTS.includes(pr.dept)){U.prof={...pr,uid:u.uid,email:u.email||pr.email||""};writeCache();enter(false)}
  else{U.prof={uid:u.uid,name:u.displayName||(u.email||"").split("@")[0]||"",email:u.email||"",year:"",dept:"",photo:(pr&&pr.photo)||""};showGate("complete")}})}catch(e){}}
// ---- profile modal ----
const pDraft=()=>$("#p_name")?{name:$("#p_name").value,year:$("#p_year").value,dept:$("#p_dept").value}:{};
function openProfile(d){if(!U.prof)return;d=d||{};const p=U.prof,has=imgOk(p.photo);
 $("#sheet").innerHTML=`<h3 style="margin:0 0 6px">👤 আমার Profile</h3>
 <div class="pf-top"><div class="av">${avInner()}</div><div class="row"><button class="btn sm" type="button" onclick="$('#pfFile').click()">📷 ${has?"Photo বদলান":"Photo add করুন"}</button>${has?'<button class="btn ghost sm" type="button" onclick="rmPhoto()">🗑 Remove</button>':""}<input type="file" id="pfFile" accept="image/*" hidden onchange="pickPhoto(this)"></div></div>
 <form onsubmit="saveProfile(event)"><label>Name *</label><input id="p_name" required maxlength="80" value="${esc(d.name??p.name)}">
 <div class="two"><div><label>Year *</label><select id="p_year" required>${opts(YEARS,d.year??p.year)}</select></div><div><label>Department *</label><select id="p_dept" required>${opts(DEPTS,d.dept??p.dept)}</select></div></div>
 <label>Email</label><input value="${esc(p.email)}" disabled>
 <div class="row"><button class="btn" id="p_btn">Save ✔</button><button type="button" class="btn ghost" onclick="closeM()">Cancel</button><button type="button" class="btn danger" onclick="logout()">🚪 Log out</button></div></form>`;
 $("#modal").classList.add("open")}
function resizeImg(file,size){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{try{const s=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,size,size);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.82))}catch(e){rej(e)}};
 im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"))};im.src=url})}
async function pickPhoto(inp){const file=inp.files&&inp.files[0];if(!file)return;if(!/^image\//.test(file.type)){toast("Shudhu image file den");return}
 const d=pDraft();try{U.prof.photo=await resizeImg(file,256)}catch(e){toast("Photo load hoyni, onno ekta den");return}
 writeCache();paintMe();openProfile(d);if(await saveProf())toast("Photo save hoyeche ✔")}
async function rmPhoto(){const d=pDraft();U.prof.photo="";writeCache();paintMe();openProfile(d);if(await saveProf())toast("Photo remove hoyeche")}
async function saveProfile(e){e.preventDefault();const d=pDraft(),b=$("#p_btn");b.disabled=true;
 U.prof={...U.prof,name:d.name.trim().slice(0,80)||U.prof.name,year:d.year,dept:d.dept};writeCache();paintMe();
 const ok=await saveProf();closeM();route();if(ok)toast("Profile update hoyeche ✔")}
$("#meBtn").onclick=()=>openProfile();
let DP=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e;$("#installBtn").style.display=""});
$("#installBtn").onclick=async()=>{if(!DP)return;DP.prompt();try{await DP.userChoice}catch(e){}DP=null;$("#installBtn").style.display="none"};
addEventListener("appinstalled",()=>{$("#installBtn").style.display="none"});
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
(function boot(){try{const c=JSON.parse(localStorage.getItem("mcn_posts")||"null");if(c&&c.posts){S.posts=c.posts;S.t=c.t;S.loaded=true}}catch(e){}
 document.addEventListener("visibilitychange",()=>{if(U.prof&&!document.hidden&&Date.now()-(S.t||0)>300000)refresh(true)});
 const c=readCache();
 if(c&&c.uid&&YEARS.includes(c.year)&&DEPTS.includes(c.dept)){U.prof=c;enter(false)}else showGate("login");
 authInit()})();
</script>
</body></html>
