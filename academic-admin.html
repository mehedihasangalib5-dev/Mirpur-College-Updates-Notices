<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#092858"><title>Academic Management | MCUN</title><link rel="icon" href="/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#092858;--navy2:#0e3c83;--blue:#1765e8;--gold:#f5b62d;--bg:#f3f6fc;--card:#fff;--ink:#152643;--muted:#6c7b94;--line:#e2eaf7;--green:#109a62;--red:#df465b;--shadow:0 10px 30px rgba(18,55,118,.08);font-family:Inter,"Hind Siliguri",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Hind Siliguri",sans-serif}button,input,select,textarea{font:inherit}button,a{cursor:pointer}a{text-decoration:none;color:inherit}.app{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}.side{background:linear-gradient(180deg,#061f49,#0b326e 62%,#061c40);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:0 10px 25px}.brand img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:12px;padding:3px}.brand b{font-size:18px;display:block}.brand small{font-size:11px;color:#c9d8f0}.nav-label{font-size:10px;letter-spacing:1.3px;color:#91acd4;padding:12px 10px 6px;font-weight:800}.nav{border:0;background:transparent;color:#d6e5ff;padding:11px 12px;border-radius:11px;text-align:left;display:flex;align-items:center;gap:11px;font-weight:600;margin:2px 0}.nav:hover,.nav.on{background:linear-gradient(100deg,#1264e4,#327ff5);color:white}.nav span{width:19px;text-align:center}.side-bottom{margin-top:auto;color:#bad0ee;font-size:11px;padding:16px 10px}.main{min-width:0;padding:20px 24px 40px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.top h1{font-size:18px;margin:0}.top .right{margin-left:auto;display:flex;align-items:center;gap:9px}.role{border-radius:99px;padding:5px 10px;background:#e8f2ff;color:#145bc6;font-size:11px;font-weight:800}.btn{border:0;border-radius:11px;padding:10px 14px;background:linear-gradient(100deg,#1765e8,#397ff0);color:white;font-size:12px;font-weight:800}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.red{background:#fff0f2;color:#c52b45}.btn.green{background:#e7f8ef;color:#087c4d}.btn:disabled{opacity:.5;cursor:not-allowed}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow);margin-bottom:15px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.panel h2{font-size:16px;margin:0}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.stat b{display:block;font-size:25px}.stat small{color:var(--muted)}.hero{border-radius:20px;padding:25px 28px;background:linear-gradient(110deg,#08275d,#155dc8);color:#fff;margin-bottom:16px;position:relative;overflow:hidden}.hero h2{margin:0 0 5px;font-size:26px}.hero p{margin:0;color:#d8e7ff}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.filters input,.filters select,.field,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:0;min-width:0}.filters input{flex:1;min-width:170px}.field:focus,textarea:focus,.filters select:focus,.filters input:focus{border-color:#78a9fc;box-shadow:0 0 0 3px #dceaff}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px}td b{font-size:12px}.chip{padding:3px 8px;border-radius:99px;background:#eaf2ff;color:#1659c3;font-size:10px;font-weight:800}.chip.green{background:#e5f8ed;color:#0d8754}.chip.amber{background:#fff4de;color:#996300}.chip.red{background:#ffedf0;color:#c93448}.actions{display:flex;gap:6px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.formgrid label{display:grid;gap:5px;font-size:11px;font-weight:700;color:#51627e}.formgrid .wide{grid-column:1/-1}textarea{min-height:100px;resize:vertical}.small{font-size:11px}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #cfdaeb;border-radius:14px}.question-builder{border:1px solid var(--line);padding:13px;border-radius:13px;margin:10px 0;background:#fbfdff}.question-builder h3{font-size:13px;margin:0 0 10px}.question-builder .qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.toast{position:fixed;right:20px;bottom:20px;background:#102f66;color:#fff;padding:12px 16px;border-radius:11px;display:none;z-index:20;box-shadow:var(--shadow)}.gate{max-width:500px;margin:12vh auto;padding:30px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#071d44aa;display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.open{display:flex}.modalbox{max-width:780px;width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.modalbox h2{margin-top:0}@media(max-width:950px){.app{grid-template-columns:210px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.main{padding:15px}}@media(max-width:650px){.app{display:block}.side{position:static;height:auto;padding:10px;display:flex;flex-direction:row;overflow:auto;gap:5px}.brand{padding:0 6px}.brand img{width:35px;height:35px}.brand small,.nav-label,.side-bottom{display:none}.nav{white-space:nowrap;padding:9px}.main{padding:12px}.top{align-items:flex-start;flex-wrap:wrap}.top .right{margin-left:auto}.stats{gap:8px}.stat{padding:11px}.stat b{font-size:21px}.formgrid,.question-builder .qgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}}
</style></head><body><div id="root"><div class="gate">Academic Manager loading…</div></div><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script type="module">
import {initializeApp,getApps} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import {getAuth,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import {getFirestore,collection,doc,getDoc,getDocs,query,where,addDoc,setDoc,updateDoc,deleteDoc,limit,writeBatch} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyAgZV0TeVSXYYnQiKqGKq7N2hAWk4FU4fo',authDomain:'muc-network-50a06.firebaseapp.com',projectId:'muc-network-50a06',storageBucket:'muc-network-50a06.firebasestorage.app',messagingSenderId:'143299318658',appId:'1:143299318658:web:5bb77c759dbd075f51359b'};const app=getApps().length?getApps()[0]:initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=()=>Date.now();const fmt=t=>t?new Date(typeof t==='number'?t:t.seconds*1000).toLocaleDateString('en-GB'):'—';
const SUBJECTS=['Physics','Chemistry','Biology','Higher Mathematics','ICT','Bangla','English','Accounting','Finance','Economics','Other'];const BOARDS=['Dhaka','Rajshahi','Cumilla','Jashore','Chattogram','Barishal','Sylhet','Dinajpur','Mymensingh'];const S={user:null,role:'',page:'dashboard',questions:[],quizzes:[],attempts:[],edit:null,builder:[],loading:false};
const toast=m=>{let e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)};const show=(html)=>{const m=$('#modal');$('#modalbox').innerHTML=html;m.classList.add('open')};const close=()=>$('#modal').classList.remove('open');$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
function gate(msg,link=true){$('#root').innerHTML=`<div class="gate"><div style="font-size:40px">🎓</div><h1>MCUN Academic Manager</h1><p>${esc(msg)}</p>${link?'<a class="btn" href="/admin">Open Admin Login</a>':''} <a class="btn ghost" href="/">Main Website</a></div>`}
function shell(content){$('#root').innerHTML=`<div class="app"><aside class="side"><div class="brand"><img src="/logo.png"><div><b>MCUN</b><small>Academic Management</small></div></div><div class="nav-label">OVERVIEW</div>${nav('dashboard','Dashboard','▦')}<div class="nav-label">BOARD QUESTION BANK</div>${nav('questions','All Questions','📖')}${nav('add-question','Add New Question','＋')}${nav('taxonomy','Boards & Subjects','◈')}<div class="nav-label">QUIZ MANAGEMENT</div>${nav('quizzes','All Quizzes','🏆')}${nav('create-quiz','Create New Quiz','＋')}${nav('attempts','Quiz Results','📊')}<div class="side-bottom">Signed in as<br><b>${esc(S.user?.email||'')}</b><br>${esc(S.role)}<br><a href="/admin" style="color:#fff;display:inline-block;margin-top:10px">← Admin Panel</a></div></aside><main class="main"><div class="top"><h1>${pageTitle()}</h1><div class="right"><span class="role">${esc(S.role)}</span><a class="btn ghost" href="/student.html">Student Portal</a><a class="btn ghost" href="/">Main Website</a><button class="btn ghost" onclick="Admin.logout()">Log out</button></div></div>${content}</main></div>`}
function pageTitle(){return ({dashboard:'Academic Dashboard',questions:'Board Question Bank', 'add-question':S.edit?'Edit Question':'Add New Question',taxonomy:'Boards & Subjects',quizzes:'Quiz Management','create-quiz':'Create New Quiz',attempts:'Quiz Results'})[S.page]||'Academic Management'}function nav(id,t,i){return `<button class="nav ${S.page===id?'on':''}" onclick="Admin.go('${id}')"><span>${i}</span>${t}</button>`}
function dashboard(){return `<section class="hero"><h2>Academic Management</h2><p>Manage board questions, verified solutions, quizzes and student results from one place.</p></section><div class="stats"><div class="stat"><b>${S.questions.length}</b><small>Board Questions</small></div><div class="stat"><b>${S.questions.filter(x=>x.status==='published').length}</b><small>Published Questions</small></div><div class="stat"><b>${S.quizzes.length}</b><small>Total Quizzes</small></div><div class="stat"><b>${S.attempts.length}</b><small>Quiz Attempts</small></div></div><section class="panel"><div class="panelhead"><h2>Quick Actions</h2></div><div class="row"><button class="btn" onclick="Admin.go('add-question')">＋ Add Board Question</button><button class="btn" onclick="Admin.go('create-quiz')">＋ Create Quiz</button><button class="btn ghost" onclick="Admin.go('questions')">Manage Questions</button><button class="btn ghost" onclick="Admin.go('quizzes')">Manage Quizzes</button></div></section><section class="panel"><div class="panelhead"><h2>Recently Added Questions</h2><button class="btn ghost" onclick="Admin.go('questions')">View all</button></div>${tableQuestions(S.questions.slice(0,6))}</section>`}
function tableQuestions(items){if(!items.length)return `<div class="empty">No question records yet. Add the first question to begin.</div>`;return `<div class="tablewrap"><table><thead><tr><th>Question</th><th>Subject</th><th>Board / Year</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody>${items.map(q=>`<tr><td><b>${esc(q.title||q.question?.slice(0,70)||'Question')}</b><br><span class="muted small">${esc(q.chapter||'')}</span></td><td>${esc(q.subject||'')}</td><td>${esc(q.board||'')} / ${esc(q.year||'')}</td><td><span class="chip">${esc(q.type||'MCQ')}</span></td><td><span class="chip ${q.status==='published'?'green':q.status==='pending'?'amber':'red'}">${esc(q.status||'draft')}</span></td><td><div class="actions"><button class="btn ghost" onclick="Admin.editQuestion('${q.id}')">Edit</button><button class="btn red" onclick="Admin.removeQuestion('${q.id}')" ${S.role==='Editor'?'disabled':''}>Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}
function questions(){return `<section class="panel"><div class="panelhead"><h2>All Board Questions</h2><button class="btn" onclick="Admin.go('add-question')">＋ Add Question</button></div><div class="filters"><input id="qsearch" placeholder="Search question title, subject or chapter…" oninput="Admin.searchQuestions(this.value)"><select id="qsubject" onchange="Admin.filterQuestions()"><option value="">All Subjects</option>${SUBJECTS.map(x=>`<option>${x}</option>`).join('')}</select><select id="qstatus" onchange="Admin.filterQuestions()"><option value="">All Status</option><option value="published">Published</option><option value="draft">Draft</option><option value="pending">Pending</option></select></div><div id="questionTable">${tableQuestions(S.questions)}</div></section>`}
function questionForm(q={}){const editing=!!q.id;return `<section class="panel"><div class="panelhead"><h2>${editing?'Edit':'Create'} Board Question</h2><span class="chip">Structured question</span></div><form id="questionForm" onsubmit="Admin.saveQuestion(event)"><div class="formgrid"><label>Question Title<input class="field" id="qt" required maxlength="160" value="${esc(q.title||'')}"></label><label>Question Type<select class="field" id="qtype" onchange="Admin.toggleQuestionType()"><option ${q.type==='MCQ'?'selected':''}>MCQ</option><option ${q.type==='CQ'?'selected':''}>CQ</option></select></label><label>Education Level<select class="field" id="qlevel"><option>HSC</option><option>SSC</option><option>Other</option></select></label><label>Exam Year<input class="field" id="qyear" type="number" min="2000" max="2100" value="${esc(q.year||new Date().getFullYear())}"></label><label>Education Board<select class="field" id="qboard">${BOARDS.map(x=>`<option ${q.board===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Subject<select class="field" id="qsub">${SUBJECTS.map(x=>`<option ${q.subject===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Chapter<input class="field" id="qchapter" value="${esc(q.chapter||'')}"></label><label>Marks<input class="field" id="qmarks" type="number" min="1" max="100" value="${esc(q.marks||1)}"></label><label class="wide">Question Text<textarea id="qtext" required>${esc(q.question||'')}</textarea></label><div class="wide" id="mcqFields" style="display:${q.type==='CQ'?'none':'block'}"><div class="formgrid"><label>Option A<input class="field" id="qa" value="${esc(q.options?.[0]||'')}"></label><label>Option B<input class="field" id="qb" value="${esc(q.options?.[1]||'')}"></label><label>Option C<input class="field" id="qc" value="${esc(q.options?.[2]||'')}"></label><label>Option D<input class="field" id="qd" value="${esc(q.options?.[3]||'')}"></label><label>Correct Option<select class="field" id="qanswer">${['A','B','C','D'].map(x=>`<option ${q.correctAnswer===x?'selected':''}>${x}</option>`).join('')}</select></label></div></div><label class="wide">Explanation / Answer<textarea id="qexplain">${esc(q.explanation||'')}</textarea></label><label class="wide">CQ Model Solution / Extra Notes<textarea id="qsolution">${esc(q.solution||'')}</textarea></label><label>Source / Reference<input class="field" id="qsource" value="${esc(q.source||'')}"></label><label>Publication Status<select class="field" id="qstatus"><option value="draft" ${q.status==='draft'?'selected':''}>Draft</option><option value="pending" ${q.status==='pending'?'selected':''}>Pending Review</option><option value="published" ${!q.status||q.status==='published'?'selected':''}>Published</option></select></label></div><div class="row" style="margin-top:15px"><button class="btn" type="submit">${editing?'Update Question':'Save Question'}</button><button class="btn ghost" type="button" onclick="Admin.go('questions')">Cancel</button></div></form></section>`}
function taxonomy(){return `<div class="stats"><div class="stat"><b>${BOARDS.length}</b><small>Configured Education Boards</small></div><div class="stat"><b>${SUBJECTS.length}</b><small>Configured Subjects</small></div><div class="stat"><b>${new Set(S.questions.map(q=>q.subject)).size}</b><small>Subjects in Question Bank</small></div><div class="stat"><b>${new Set(S.questions.map(q=>q.year)).size}</b><small>Exam Years Available</small></div></div><section class="panel"><h2>Education Boards</h2><p class="muted small">Initial board list used in Admin forms and student filters.</p><div class="row">${BOARDS.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></section><section class="panel"><h2>Subjects</h2><p class="muted small">Add and edit the subject constants in this page when your curriculum expands.</p><div class="row">${SUBJECTS.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></section>`}
function quizzes(){if(!S.quizzes.length)return `<section class="panel"><div class="empty">No quizzes created yet. Create your first quiz with questions and answer keys.</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="Admin.go('create-quiz')">＋ Create Quiz</button></div></section>`;return `<section class="panel"><div class="panelhead"><h2>All Quizzes</h2><button class="btn" onclick="Admin.go('create-quiz')">＋ Create Quiz</button></div><div class="tablewrap"><table><thead><tr><th>Title</th><th>Subject</th><th>Mode</th><th>Questions</th><th>Duration</th><th>Status</th><th>Actions</th></tr></thead><tbody>${S.quizzes.map(q=>`<tr><td><b>${esc(q.title)}</b><br><span class="muted small">${esc(q.description||'')}</span></td><td>${esc(q.subject||'')}</td><td>${esc(q.mode||'practice')}</td><td>${q.questionCount||0}</td><td>${q.durationMinutes||0} min</td><td><span class="chip ${q.status==='published'?'green':'amber'}">${esc(q.status)}</span></td><td><button class="btn ghost" onclick="Admin.archiveQuiz('${q.id}')">Archive</button></td></tr>`).join('')}</tbody></table></div></section>`}
function builderItem(i){const q=S.builder[i];return `<div class="question-builder"><div class="panelhead"><h3>Question ${i+1}</h3><button type="button" class="btn red" onclick="Admin.removeBuilder(${i})">Remove</button></div><div class="qgrid"><label class="wide small">Question<textarea class="b-question" data-i="${i}" required>${esc(q.question)}</textarea></label><label>Option A<input class="field b-option" data-i="${i}" data-opt="0" value="${esc(q.options[0])}" required></label><label>Option B<input class="field b-option" data-i="${i}" data-opt="1" value="${esc(q.options[1])}" required></label><label>Option C<input class="field b-option" data-i="${i}" data-opt="2" value="${esc(q.options[2])}" required></label><label>Option D<input class="field b-option" data-i="${i}" data-opt="3" value="${esc(q.options[3])}" required></label><label>Correct Answer<select class="field b-answer" data-i="${i}">${['A','B','C','D'].map((x,j)=>`<option value="${x}" ${q.answer===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Marks<input class="field b-marks" data-i="${i}" type="number" min="1" max="20" value="${q.marks||1}"></label><label class="wide">Explanation<textarea class="b-explain" data-i="${i}">${esc(q.explanation)}</textarea></label></div></div>`}
function createQuiz(){if(!S.builder.length)S.builder=[newBuilder()];return `<section class="panel"><div class="panelhead"><h2>Create New Quiz</h2><span class="chip">MCQ Builder</span></div><form id="quizForm" onsubmit="Admin.saveQuiz(event)"><div class="formgrid"><label>Quiz Title<input class="field" id="zt" required maxlength="120" placeholder="e.g. Physics Chapter 3 Practice"></label><label>Subject<select class="field" id="zsub">${SUBJECTS.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Chapter<input class="field" id="zchapter" placeholder="Chapter name or number"></label><label>Academic Batch<select class="field" id="zbatch"><option>HSC 1st Year</option><option selected>HSC 2nd Year</option><option>All HSC</option></select></label><label>Quiz Mode<select class="field" id="zmode"><option value="practice">Practice Mode</option><option value="exam">Exam Mode</option></select></label><label>Duration (minutes)<input class="field" id="zduration" type="number" min="0" max="240" value="20"></label><label>Passing Marks (%)<input class="field" id="zpass" type="number" min="0" max="100" value="40"></label><label>Maximum Attempts<input class="field" id="zattempts" type="number" min="1" max="50" value="3"></label><label class="wide">Description<textarea id="zdesc" placeholder="Short instruction for students"></textarea></label><label>Start At (optional)<input class="field" id="zstart" type="datetime-local"></label><label>End At (optional)<input class="field" id="zend" type="datetime-local"></label></div><div class="panelhead" style="margin-top:20px"><h2>Questions</h2><button type="button" class="btn ghost" onclick="Admin.addBuilder()">＋ Add Question</button></div><div id="builder">${S.builder.map((_,i)=>builderItem(i)).join('')}</div><div class="row"><button type="submit" class="btn">Publish Quiz</button><button type="button" class="btn ghost" onclick="Admin.go('quizzes')">Cancel</button></div></form></section>`}
function attempts(){return `<section class="panel"><div class="panelhead"><h2>Quiz Attempts & Results</h2><span class="chip">${S.attempts.length} records</span></div>${S.attempts.length?`<div class="tablewrap"><table><thead><tr><th>Student UID</th><th>Quiz</th><th>Subject</th><th>Score</th><th>Percentage</th><th>Submitted</th></tr></thead><tbody>${S.attempts.map(a=>`<tr><td><code>${esc((a.uid||'').slice(0,12))}…</code></td><td><b>${esc(a.quizTitle||'Quiz')}</b></td><td>${esc(a.subject||'')}</td><td>${a.correct||0}/${a.totalQuestions||0}</td><td><span class="chip ${a.percentage>=40?'green':'red'}">${a.percentage||0}%</span></td><td>${fmt(a.createdAt)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No quiz attempts have been submitted yet.</div>`}</section>`}
function render(){if(!S.user||!S.role){gate('Sign in with an authorized MCUN admin account to manage academic content.');return}let v='';switch(S.page){case'dashboard':v=dashboard();break;case'questions':v=questions();break;case'add-question':v=questionForm(S.edit||{});break;case'taxonomy':v=taxonomy();break;case'quizzes':v=quizzes();break;case'create-quiz':v=createQuiz();break;case'attempts':v=attempts();break;default:v=dashboard()}shell(v)}
async function loadData(){const [qs,zs,as]=await Promise.all([getDocs(collection(db,'boardQuestions')),getDocs(collection(db,'quizSets')),S.role==='Editor'?Promise.resolve({docs:[]}):getDocs(collection(db,'quizAttempts'))]);S.questions=qs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));S.quizzes=zs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));S.attempts=as.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render()}
function newBuilder(){return {question:'',options:['','','',''],answer:'A',marks:1,explanation:''}}
const Admin={go(page){S.page=page;S.edit=null;if(page!=='create-quiz')S.builder=[];render()},logout:async()=>{await signOut(auth);location.href='/admin'},searchQuestions(v){const q=(v||'').toLowerCase();const items=S.questions.filter(x=>[x.title,x.question,x.subject,x.chapter,x.board].join(' ').toLowerCase().includes(q));$('#questionTable').innerHTML=tableQuestions(items)},filterQuestions(){const s=$('#qsubject').value,st=$('#qstatus').value;$('#questionTable').innerHTML=tableQuestions(S.questions.filter(x=>(!s||x.subject===s)&&(!st||x.status===st)))},editQuestion(id){S.edit=S.questions.find(x=>x.id===id);S.page='add-question';render()},toggleQuestionType(){const el=$('#mcqFields');if(el)el.style.display=$('#qtype').value==='MCQ'?'block':'none'},removeQuestion:async(id)=>{if(S.role==='Editor')return toast('Editor permission-e delete nei');if(!confirm('এই প্রশ্নটি delete করবেন?'))return;try{await deleteDoc(doc(db,'boardQuestions',id));await loadData();toast('Question deleted')}catch(e){toast('Delete হয়নি: '+e.code)}},saveQuestion:async(e)=>{e.preventDefault();const type=$('#qtype').value,options=type==='MCQ'?['qa','qb','qc','qd'].map(x=>$('#'+x).value.trim()):[];if(type==='MCQ'&&options.some(x=>!x))return toast('সব MCQ option পূরণ করুন');const data={title:$('#qt').value.trim(),type,level:$('#qlevel').value,year:Number($('#qyear').value),board:$('#qboard').value,subject:$('#qsub').value,chapter:$('#qchapter').value.trim(),marks:Number($('#qmarks').value)||1,question:$('#qtext').value.trim(),options,explanation:$('#qexplain').value.trim(),solution:$('#qsolution').value.trim(),correctAnswer:type==='MCQ'?$('#qanswer').value:'',source:$('#qsource').value.trim(),status:$('#qstatus').value,createdAt:S.edit?.createdAt||stamp(),updatedAt:stamp(),createdBy:S.user.uid};try{if(S.edit)await updateDoc(doc(db,'boardQuestions',S.edit.id),data);else await addDoc(collection(db,'boardQuestions'),data);S.edit=null;S.page='questions';await loadData();toast('Question saved')}catch(x){toast('Save হয়নি: '+(x.code||x.message))}},addBuilder(){S.builder.push(newBuilder());render()},removeBuilder(i){if(S.builder.length===1)return toast('At least one question required');S.builder.splice(i,1);render()},saveQuiz:async(e)=>{e.preventDefault();const form=$('#quizForm');for(let i=0;i<S.builder.length;i++){const q=S.builder[i];q.question=$(`.b-question[data-i="${i}"]`).value.trim();q.options=[...document.querySelectorAll(`.b-option[data-i="${i}"]`)].sort((a,b)=>Number(a.dataset.opt)-Number(b.dataset.opt)).map(x=>x.value.trim());q.answer=$(`.b-answer[data-i="${i}"]`).value;q.marks=Number($(`.b-marks[data-i="${i}"]`).value)||1;q.explanation=$(`.b-explain[data-i="${i}"]`).value.trim();if(!q.question||q.options.some(x=>!x))return toast('প্রতিটি প্রশ্ন ও চারটি option পূরণ করুন')}const start=$('#zstart').value?new Date($('#zstart').value).getTime():0,end=$('#zend').value?new Date($('#zend').value).getTime():0;if(start&&end&&end<=start)return toast('End time must be after start time');const quizRef=doc(collection(db,'quizSets'));const quiz={title:$('#zt').value.trim(),subject:$('#zsub').value,chapter:$('#zchapter').value.trim(),batch:$('#zbatch').value,mode:$('#zmode').value,durationMinutes:Number($('#zduration').value)||0,passingPercent:Number($('#zpass').value)||0,maxAttempts:Number($('#zattempts').value)||1,description:$('#zdesc').value.trim(),startAt:start||null,endAt:end||null,questionCount:S.builder.length,totalMarks:S.builder.reduce((n,x)=>n+(Number(x.marks)||1),0),status:'published',createdAt:stamp(),createdBy:S.user.uid};try{const batch=writeBatch(db);batch.set(quizRef,quiz);for(let i=0;i<S.builder.length;i++){const q=S.builder[i],qRef=doc(collection(db,'quizQuestions'));batch.set(qRef,{quizId:quizRef.id,question:q.question,options:q.options,type:'single',marks:q.marks,order:i,createdAt:stamp()});batch.set(doc(db,'quizAnswerKeys',qRef.id),{quizId:quizRef.id,correctAnswer:q.answer,explanation:q.explanation,marks:q.marks})}await batch.commit();S.builder=[];S.page='quizzes';await loadData();toast('Quiz published')}catch(x){toast('Quiz save হয়নি: '+(x.code||x.message))}},archiveQuiz:async(id)=>{if(!confirm('Quiz archive করবেন?'))return;try{await updateDoc(doc(db,'quizSets',id),{status:'archived',updatedAt:stamp()});await loadData();toast('Quiz archived')}catch(e){toast('Archive হয়নি: '+e.code)}}};

onAuthStateChanged(auth,async user=>{S.user=user;if(!user){gate('Login required. Please sign in through the existing Admin Panel first.');return}if(!user.emailVerified){gate('Your email must be verified before accessing Admin tools.');return}try{const snap=await getDoc(doc(db,'config','admins'));if(!snap.exists()){gate('Admin configuration is missing.');return}const c=snap.data(),email=(user.email||'').toLowerCase(),ids=c.ids||[],emails=(c.emails||[]).map(x=>String(x).toLowerCase()),editors=(c.editors||[]).map(x=>String(x).toLowerCase());const isAdmin=ids.includes(user.uid)||emails.includes(email),isEditor=!isAdmin&&editors.includes(email);if(!isAdmin&&!isEditor){gate('এই অ্যাকাউন্টের Academic Manager access নেই।');return}S.role=ids[0]===user.uid||emails[0]===email?'Owner':isAdmin?'Admin':'Editor';await loadData()}catch(e){console.error(e);gate('Permission denied or database connection failed. Check Firestore Rules.')}});
